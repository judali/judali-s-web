.book-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:520px;margin:16px 0}

.book-btn .bm{font-size:.68em;color:#888}
.book-btn.all{background:linear-gradient(135deg,#f9ca24,#f0932b);color:#1a1a2e;border-color:#f9ca24;font-weight:700}

.game-header .stat{text-align:center}
.game-header .stat .v{font-size:1.1em;font-weight:700;color:#f9ca24}
.game-header .stat .l{font-size:.6em;color:#999}
.hint-btn{padding:6px 14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#ccc;border-radius:14px;cursor:pointer;font-size:.75em;transition:.15s}
.hint-btn:hover{background:rgba(255,255,255,.2)}

.game-main{flex:1;width:100%;max-width:640px;padding:16px 14px 40px;display:flex;flex-direction:column;align-items:center}
.lvl-title{text-align:center;margin-bottom:4px}
.lvl-title h2{font-size:1.15em;color:#f9ca24;margin-bottom:4px}
.lvl-title .lvl-sub{font-size:.75em;color:#999}

.progress-dots{display:flex;gap:4px;margin:8px 0 20px;flex-wrap:wrap;justify-content:center}
.progress-dots .dot{width:8px;height:8px;border-radius:50%;background:#333;transition:.3s}
.progress-dots .dot.done{background:#f9ca24}
.progress-dots .dot.current{background:#f0932b;box-shadow:0 0 8px rgba(249,202,36,.5)}

.items-area{width:100%;display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.tl-item{background:#16213e;border:2px solid #2a3a5c;border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .2s;position:relative;display:flex;align-items:center;gap:12px;user-select:none;-webkit-tap-highlight-color:transparent}
.tl-item:hover{border-color:#f9ca24;background:#1c2b4a}
.tl-item:active{transform:scale(.98)}

.tl-item.placed .order-num{background:#f9ca24;color:#1a1a2e;transform:scale(1.1)}
.tl-item .event-text{flex:1;font-size:.92em;line-height:1.4}
.tl-item .event-year{font-size:.72em;color:#f9ca24;font-weight:600;margin-top:2px;display:none}
.tl-item.placed .event-year{display:block}
.event-orig{font-size:.7em;color:#888;margin-top:3px;line-height:1.4}
.tl-item .drag-handle{color:#555;font-size:1.1em;flex-shrink:0}

.tl-item.correct-flash{animation:correctPulse .5s ease;border-color:#28a745!important;background:#0d2818!important}
.tl-item.wrong-shake{animation:shake .4s ease;border-color:#dc3545!important;background:#280d0d!important}
.tl-item.hint-glow{animation:hintGlow .6s ease 2;border-color:#f9ca24!important}

@keyframes hintGlow{0%,100%{box-shadow:0 0 0 rgba(249,202,36,0)}50%{box-shadow:0 0 20px rgba(249,202,36,.4)}}

let currentLevel=0,totalScore=0,streak=0,bestStreak=0,totalMistakes=0,perfectLevels=0,hintsLeft=3;
let placedItems=[],mistakesThisRound=0,weakLevels=[],roundActive=false,activeLevels=[];

function startGame(book){
  if(book==='all'){activeLevels=[...levels];}
  else{activeLevels=levels.filter(l=>l.bk.startsWith(book));}
  if(!activeLevels.length){alert('该册暂无关卡');return;}
  currentLevel=0;totalScore=0;streak=0;bestStreak=0;totalMistakes=0;perfectLevels=0;hintsLeft=3;weakLevels=[];
  document.getElementById('startScreen').classList.remove('active');
  document.getElementById('endScreen').classList.remove('active');
  document.getElementById('gameScreen').classList.add('active');
  document.getElementById('hintCount').textContent=hintsLeft;
  updateHeaderStats();
  loadLevel(0);
}

function loadLevel(idx){
  if(idx>=activeLevels.length){showEndScreen();return;}
  currentLevel=idx;placedItems=[];mistakesThisRound=0;roundActive=true;
  let lvl=activeLevels[idx];
  document.getElementById('lvlLabel').textContent='第'+(idx+1)+'/'+activeLevels.length+'关';
  document.getElementById('lvlTitle').textContent=lvl.title;
  document.getElementById('lvlSub').textContent=lvl.sub+' · '+lvl.bk+'册'+(lvl.id<=16?' 🇨🇳':' 🌍');
  let dots='';
  for(let i=0;i<activeLevels.length;i++){
    let cls=i<idx?'done':(i===idx?'current':'');
    dots+='<div class="dot '+cls+'"></div>';
  }
  document.getElementById('progressDots').innerHTML=dots;
  let shuffled=[...lvl.items].sort(()=>Math.random()-.5);
  let html='';
  shuffled.forEach((item,i)=>{
    html+='<div class="tl-item" data-index="'+i+'" data-year="'+item.year+'" onclick="selectItem(this)">'+
      '<div class="order-num">?</div><div class="event-text">'+item.event+'</div><div class="drag-handle">⠿</div></div>';
  });
  document.getElementById('itemsArea').innerHTML=html;
  document.getElementById('feedback').classList.remove('show','perfect','good','ok');
}

function selectItem(el){
  if(!roundActive||el.classList.contains('placed'))return;
  let lvl=activeLevels[currentLevel];
  let correctIdx=placedItems.length;
  let correctItem=lvl.items[correctIdx];
  if(el.dataset.year===correctItem.year){
    el.classList.add('placed','correct-flash');
    el.querySelector('.order-num').textContent=correctIdx+1;
    el.querySelector('.event-text').innerHTML=correctItem.event+'<div class="event-year">'+correctItem.year+'</div><div class="event-orig">📖 '+correctItem.desc+'</div>';
    el.querySelector('.drag-handle').style.display='none';
    el.style.pointerEvents='none';
    placedItems.push(correctItem);
    setTimeout(()=>el.classList.remove('correct-flash'),500);
    if(placedItems.length===lvl.items.length){roundActive=false;showFeedback();}
  }else{
    mistakesThisRound++;totalMistakes++;
    el.classList.add('wrong-shake');
    setTimeout(()=>el.classList.remove('wrong-shake'),400);
    let allItems=document.querySelectorAll('#itemsArea .tl-item');
    allItems.forEach(item=>{
      if(!item.classList.contains('placed')&&item.dataset.year===correctItem.year){
        item.classList.add('hint-glow');
        setTimeout(()=>item.classList.remove('hint-glow'),1200);
      }
    });
  }
}

function useHint(){
  if(hintsLeft<=0||!roundActive)return;
  hintsLeft--;document.getElementById('hintCount').textContent=hintsLeft;
  let lvl=activeLevels[currentLevel];
  let nextIdx=placedItems.length;
  if(nextIdx>=lvl.items.length)return;
  let correctItem=lvl.items[nextIdx];
  document.querySelectorAll('#itemsArea .tl-item').forEach(item=>{
    if(!item.classList.contains('placed')&&item.dataset.year===correctItem.year){
      item.classList.add('hint-glow');
      setTimeout(()=>item.classList.remove('hint-glow'),1800);
    }
  });
}

function showFeedback(){
  let lvl=levels[currentLevel],fb=document.getElementById('feedback');
  let score,icon,grade;
  if(mistakesThisRound===0){score=100;icon='🌟';grade='perfect';perfectLevels++;streak++;if(streak>bestStreak)bestStreak=streak;}
  else if(mistakesThisRound===1){score=70;icon='👍';grade='good';streak=0;}
  else if(mistakesThisRound===2){score=40;icon='📖';grade='ok';streak=0;}
  else{score=20;icon='💪';grade='ok';streak=0;}
  if(streak>=3)score=Math.round(score*1.5);
  totalScore+=score;
  document.getElementById('fbIcon').textContent=icon;
  document.getElementById('fbScore').textContent='+'+score+'分'+(streak>=3?' 🔥'+streak+'连击!':'');
  document.getElementById('fbDetail').textContent=mistakesThisRound===0?'完美！时间线完全正确！':'失误'+mistakesThisRound+'次';
  let tlHtml='';
  lvl.items.forEach((item,i)=>{
    tlHtml+='<div><span class="tl-year">'+item.year+'</span> '+item.event+' — '+item.desc+'</div>';
  });
  document.getElementById('fbTimeline').innerHTML=tlHtml;
  fb.className='feedback show '+grade;
  document.getElementById('nextBtn').textContent=currentLevel>=activeLevels.length-1?'查看成绩 🏆':'下一关 ›';
  if(mistakesThisRound>0)weakLevels.push({title:lvl.title,mistakes:mistakesThisRound});
  updateHeaderStats();
}

function nextLevel(){
  currentLevel++;
  if(currentLevel>=activeLevels.length)showEndScreen();
  else loadLevel(currentLevel);
}

function updateHeaderStats(){
  document.getElementById('scoreDisplay').textContent=totalScore;
  document.getElementById('streakDisplay').textContent=streak;
}

function backToMenu(){
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('endScreen').classList.remove('active');
  document.getElementById('startScreen').classList.add('active');
}
function retryBook(){
  currentLevel=0;totalScore=0;streak=0;bestStreak=0;totalMistakes=0;perfectLevels=0;hintsLeft=3;weakLevels=[];
  document.getElementById('endScreen').classList.remove('active');
  document.getElementById('gameScreen').classList.add('active');
  document.getElementById('hintCount').textContent=hintsLeft;
  updateHeaderStats();
  loadLevel(0);
}
function showEndScreen(){
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('endScreen').classList.add('active');
  let max=activeLevels.length*100,pct=Math.round(totalScore/max*100);
  document.getElementById('endScore').textContent=totalScore;
  document.getElementById('endPerfect').textContent=perfectLevels+'/'+activeLevels.length;
  document.getElementById('endBest').textContent=bestStreak;
  document.getElementById('endMistakes').textContent=totalMistakes;
  let t,ti;
  if(pct>=90){t='🏆';ti='时间大师！';}
  else if(pct>=70){t='🥇';ti='相当不错！';}
  else if(pct>=50){t='🥈';ti='继续加油！';}
  else{t='📚';ti='再练练！';}
  document.getElementById('endTrophy').textContent=t;
  document.getElementById('endTitle').textContent=ti;
  let wl='';
  if(weakLevels.length>0){
    wl+='<h3>⚠️ 需要重点复习的关卡：</h3>';
    weakLevels.forEach(w=>{wl+='<div class="weak-item">'+w.title+' — 失误'+w.mistakes+'次</div>';});
  }
  document.getElementById('weakList').innerHTML=wl;
}

document.addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H')useHint();});
</script>
</body>
</html>
