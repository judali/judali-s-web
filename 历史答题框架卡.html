<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中考历史 · 答题框架卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333;min-height:100vh}
.header{background:linear-gradient(135deg,#8b4513,#a0522d,#cd853f);color:#fff;padding:18px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.header h1{font-size:1.3em;text-align:center;margin-bottom:2px}
.header .sub{text-align:center;font-size:.8em;opacity:.8}
.stats{display:flex;justify-content:center;gap:16px;margin-top:10px;flex-wrap:wrap}
.stats .s{background:rgba(255,255,255,.12);border-radius:10px;padding:6px 14px;text-align:center;min-width:70px}
.stats .s .n{font-size:1.3em;font-weight:700}
.stats .s .l{font-size:.65em;opacity:.8}
.cat-nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:12px 16px 6px;position:sticky;top:125px;z-index:99;background:#f0f2f5}
.cat-btn{padding:6px 14px;border-radius:18px;border:2px solid #d0d5dd;background:#fff;cursor:pointer;font-size:.85em;transition:.2s;white-space:nowrap}
.cat-btn:hover{border-color:#a0522d;color:#a0522d}
.cat-btn.active{background:#a0522d;color:#fff;border-color:#a0522d}
.cat-btn .ct{font-size:.7em;opacity:.7;margin-left:3px}
.main{max-width:800px;margin:0 auto;padding:10px 16px 40px}
.modes{display:flex;gap:6px;margin-bottom:14px;justify-content:center;flex-wrap:wrap}
.mode-btn{padding:8px 16px;border-radius:10px;border:2px solid #d0d5dd;background:#fff;cursor:pointer;font-size:.85em;transition:.2s}
.mode-btn.active{background:#a0522d;color:#fff;border-color:#a0522d}
.search{width:100%;padding:10px 16px;border-radius:10px;border:2px solid #d0d5dd;font-size:.95em;margin-bottom:12px;outline:none;display:none}
.search:focus{border-color:#a0522d}
.pbar{height:4px;background:#e0e0e0;border-radius:2px;margin-bottom:14px}
.pfill{height:100%;background:#a0522d;border-radius:2px;transition:width .4s}
.card-wrap{perspective:1000px;margin-bottom:10px}
.card{background:#fff;border-radius:14px;padding:24px 20px;cursor:pointer;min-height:180px;box-shadow:0 3px 12px rgba(0,0,0,.06);transition:.3s;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:3px solid #e0e0e0}
.card:hover{box-shadow:0 6px 20px rgba(0,0,0,.12);transform:translateY(-1px)}
.card.mastered{border-color:#28a745;background:#f8fff9}
.card.unfamiliar{border-color:#ffc107;background:#fffbf0}
.card .badge{position:absolute;top:10px;left:14px;background:#a0522d;color:#fff;padding:2px 10px;border-radius:10px;font-size:.7em}
.card .cid{position:absolute;top:10px;right:14px;color:#999;font-size:.75em}
.card .q{font-size:1.1em;line-height:1.7;color:#1a1a2e}
.card .a{display:none;font-size:1em;line-height:1.8;color:#2d5016;padding-top:14px;border-top:2px dashed #e0e0e0;margin-top:14px;width:100%;text-align:left}
.card .a b{color:#a0522d}
.card.flipped .a{display:block}
.card.flipped .q{color:#888;font-size:.9em;opacity:.7}
.card .hint{font-size:.7em;color:#bbb;margin-top:10px}
.card.flipped .hint{display:none}
.actions{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.a-btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:.85em;transition:.2s}
.a-unf{background:#fff3cd;color:#856404}
.a-unf:hover{background:#ffeaa7}
.a-done{background:#d4edda;color:#155724}
.a-done:hover{background:#c3e6cb}
.a-clear{background:#f8d7da;color:#721c24}
.a-clear:hover{background:#f5c6cb}
.a-rand{background:#e2e3e5;color:#383d41}
.a-rand:hover{background:#d6d8d9}
.nav-btns{display:flex;justify-content:center;gap:10px;margin-top:8px}
.nav-btn{padding:10px 24px;border-radius:10px;border:none;cursor:pointer;font-size:.95em;background:#a0522d;color:#fff;transition:.2s}
.nav-btn:hover{background:#8b4513}
.nav-btn:disabled{background:#ccc;cursor:not-allowed}
.nav-btn.sec{background:#fff;color:#a0522d;border:2px solid #a0522d}

/* list mode */
.lv{display:none}
.lv.on{display:block}
.lv .g{margin-bottom:20px}
.lv .g h3{font-size:1em;color:#a0522d;padding:6px 12px;background:#f5e6d3;border-radius:8px;margin-bottom:8px}
.lv .it{background:#fff;border-radius:10px;padding:14px 18px;margin-bottom:6px;box-shadow:0 1px 3px rgba(0,0,0,.04);cursor:pointer;border-left:4px solid #e0e0e0;transition:.15s}
.lv .it.mastered{border-left-color:#28a745;background:#f8fff9}
.lv .it.unfamiliar{border-left-color:#ffc107;background:#fffbf0}
.lv .it .iq{font-weight:600;margin-bottom:4px}
.lv .it .ia{display:none;color:#2d5016;line-height:1.6;padding-top:6px;border-top:1px solid #eee}
.lv .it.on .ia{display:block}

/* error mode */
.ev{display:none;background:#fff;border-radius:14px;padding:20px;box-shadow:0 3px 12px rgba(0,0,0,.06)}
.ev.on{display:block}
.ev h2{color:#a0522d;margin-bottom:12px}
.ev .el{max-height:400px;overflow-y:auto}
.ev .ei{padding:10px 14px;background:#fffbf0;border-left:4px solid #ffc107;margin-bottom:6px;border-radius:6px;cursor:pointer}
.ev .ei .eq{font-weight:600;color:#856404;margin-bottom:3px}
.ev .ei .ea{font-size:.85em;color:#555}

/* summary */
.sv{display:none;background:#fff;border-radius:14px;padding:24px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.06)}
.sv.on{display:block}
.sv .big{font-size:2.5em;font-weight:700;color:#a0522d}
.sv table{width:100%;border-collapse:collapse;margin-top:14px}
.sv td{padding:6px 10px;text-align:left;font-size:.9em}
.sv .cname{font-weight:600}
.sv .cbar{background:#f5e6d3;border-radius:6px;height:18px;overflow:hidden}
.sv .cfill{height:100%;background:linear-gradient(90deg,#a0522d,#8b4513);border-radius:6px;transition:width .5s}

@media(max-width:600px){
.header h1{font-size:1.1em}
.stats{gap:6px}
.stats .s{padding:5px 8px;min-width:55px}
.stats .s .n{font-size:1em}
.card{padding:18px 14px;min-height:150px}
.card .q{font-size:1em}
.cat-btn{padding:5px 10px;font-size:.75em}
}
</style>
</head>
<body>

<div class="header">
<h1>中考历史 · 答题框架卡</h1>
<p class="sub">通用模板 · 题型全覆盖 · 不限题目</p>
<div class="stats">
<div class="s"><div class="n" id="tN">0</div><div class="l">总卡</div></div>
<div class="s"><div class="n" id="mN">0</div><div class="l">已掌握</div></div>
<div class="s"><div class="n" id="uN">0</div><div class="l">待复习</div></div>
<div class="s"><div class="n" id="pP">0%</div><div class="l">掌握率</div></div>
</div>
</div>

<div class="cat-nav" id="catNav"></div>

<div class="main">
<div class="modes">
<button class="mode-btn active" onclick="switchMode('card')">卡片</button>
<button class="mode-btn" onclick="switchMode('list')">列表</button>
<button class="mode-btn" onclick="switchMode('error')">错题本</button>
<button class="mode-btn" onclick="switchMode('summary')">掌握度</button>
</div>
<input class="search" id="searchBox" placeholder="搜索框架..." oninput="applySearch()">
<div class="pbar"><div class="pfill" id="pFill" style="width:0%"></div></div>

<!-- card mode -->
<div id="cardView">
<div class="card-wrap"><div class="card" id="card" onclick="flip()">
<div class="badge" id="cBadge"></div><div class="cid" id="cId"></div>
<div class="q" id="cQ"></div><div class="a" id="cA"></div>
<div class="hint">点击卡片翻转查看答案</div>
</div></div>
<div class="actions">
<button class="a-btn a-unf" onclick="mark('unfamiliar')">不熟悉</button>
<button class="a-btn a-done" onclick="mark('mastered')">已掌握</button>
<button class="a-btn a-clear" onclick="mark('none')">清除</button>
<button class="a-btn a-rand" onclick="randomCard()">随机</button>
</div>
<div class="nav-btns">
<button class="nav-btn sec" onclick="prevCard()">上一张</button>
<button class="nav-btn" onclick="nextCard()">下一张</button>
</div>
</div>

<!-- list mode -->
<div class="lv" id="listView"></div>

<!-- error mode -->
<div class="ev" id="errorView">
<h2>待复习 (<span id="errCount">0</span>)</h2>
<div class="el" id="errList"></div>
<button class="nav-btn" style="margin-top:14px" onclick="clearErrors()">清空错题本</button>
</div>

<!-- summary -->
<div class="sv" id="summaryView">
<div class="big" id="sPct">0%</div>
<p style="margin-bottom:12px">整体掌握度</p>
<table id="sTable"></table>
<button class="nav-btn" style="margin-top:14px" onclick="resetAll()">重置进度</button>
</div>
</div>

<script>
const STORE = 'hist_framework_progress';
const cards = [
{id:1,cat:"结论模板",q:"你刚写完一篇关于辛亥革命的小论文，结尾写了'沧桑巨变，令人感慨'。阅卷老师会扣分吗？缺了什么？",a:"<b>肯定扣分！缺政治结论。</b><br><br>正确结尾：文采句 + 因此 + 政治三件套<br><br>沧桑巨变，令人感慨。<b>因此，只有坚持中国共产党的领导，立足国情，走中国特色社会主义道路，才能实现民族复兴。</b><br><br>政治三件套一个不能少：<br><b>党 + 国情 + 中国特色</b>"},
{id:2,cat:"结论模板",q:"你写完一篇关于改革开放的小论文，结尾是'实践证明改革开放是正确的'。够了吗？",a:"<b>不够！太短太虚。</b><br><br>至少要补：<br><b>坚持中国共产党的领导</b>，<b>立足社会主义初级阶段国情</b>，坚定不移走<b>中国特色社会主义道路</b>。<br><br>结论公式：<br>因此/综上所述 + 党的领导 + 立足国情 + 中国特色"},
{id:3,cat:"结构框架",q:"题目给了4件文物：青铜器、唐三彩、青花瓷、杂交水稻证书。你答题时漏了青铜器，后果是什么？",a:"<b>跳过任一物品 = 直接扣分。</b><br><br>正确做法：<br>① 做题前先把材料物品列清单<br>② 每个物品逐一对应课本术语<br>③ 按时间顺序写，一个不漏<br><br>青铜器→商周礼制<br>唐三彩→盛唐丝路交流<br>青花瓷→宋元瓷器鼎盛<br>杂交水稻→现代科技输出"},
{id:4,cat:"结构框架",q:"题目：'从丝绸之路到一带一路，什么变了什么没变？'你用一句话概括答题结构。",a:"<b>变 = 路线+方式+角色，不变 = 促进交流+共同发展的本质。</b><br><br>变：陆路→海陆空；商品交换→技术合作；中国输入→中国输出<br>不变：促进文明交融、推动经济发展的根本目的<br><br>所有'变与不变'题都用这个双线结构。"},
{id:5,cat:"结构框架",q:"材料依次给了洋务运动、戊戌变法、新文化运动。你的开头第一句话写什么？",a:"<b>'近代中国的探索经历了从器物到制度再到思想的逐步深化过程。'</b><br><br>开头必须亮出递进方向，阅卷老师一眼看到主线。<br><br>常用递进式开头：<br>· 从效仿西方 → 结合国情 → 走出自主道路<br>· 从器物 → 制度 → 思想（由表及里）<br>· 从封闭 → 开放 → 引领"},
{id:6,cat:"结构框架",q:"普陀卷第2题你答了'内燃机'，第3题问'牛马为什么退出历史舞台'。这两题有什么关系？",a:"<b>因果关系！第3题必须呼应第2题。</b><br><br>第2题：内燃机的发明与应用<br>第3题：内燃机取代畜力 → 牛马退役 → 工业时代到来<br><br>后一题的答案如果和前一题没有逻辑连接，说明你漏了得分维度。<br>做题时就标注题号关联。"},
{id:7,cat:"对比题",q:"题目问'井冈山道路为什么是世界各国从来没有的？'答题框架是什么？",a:"<b>参照物 + 不同点 + 原因。</b><br><br>参照物：苏俄/世界无产阶级革命以<b>城市为中心</b>发动起义<br>不同点：毛泽东走<b>农村包围城市</b><br>原因：中国是<b>半殖民地半封建社会</b>，农民占绝大多数，敌人在城市力量强<br><br>只答'结合国情'不写苏俄对比 = 丢一半分"},
{id:8,cat:"术语翻译",q:"你写'清末社会一片黑暗腐朽'，阅卷老师要的标准词是什么？",a:"<b>半殖民地半封建社会</b><br><br>可替换：封建帝制瓦解 / 辛亥革命推翻君主专制<br><br>永远不要用'黑暗''腐朽'这种形容词代替课本术语。"},
{id:9,cat:"术语翻译",q:"你写'学生们爱国热情高涨，纷纷走上街头'，该换成什么术语？",a:"<b>五四运动 / 救亡图存成为时代主流</b><br><br>可替换：民族意识空前觉醒<br><br>'爱国热情'不是历史术语，'救亡图存'才是。"},
{id:10,cat:"术语翻译",q:"你写'全国上下齐心协力打日本鬼子'，该换成什么？",a:"<b>民族矛盾上升为主要矛盾 / 全民族抗战</b><br><br>完整版：中国共产党领导的全民族抗战<br><br>'打鬼子'是口语，'全民族抗战'是术语。"},
{id:11,cat:"术语翻译",q:"你写'国民党政府太腐败了最后完蛋了'，该换成什么？",a:"<b>国民党反动统治的腐败与灭亡</b><br><br>完整版：中国共产党领导人民推翻三座大山<br><br>'完蛋了'绝对不行，'反动统治的腐败与灭亡'才是答案。"},
{id:12,cat:"术语翻译",q:"你写'改革开放后中国经济变好了'，该换成什么术语？",a:"<b>社会主义市场经济体制建立与完善</b><br><br>可替换：中国特色社会主义道路 / 改革开放深化<br><br>'经济变好了'不是历史术语，要写具体的制度名称。"},
{id:13,cat:"时间轴",q:"材料写道'1928年，毛泽东在井冈山……'，你应该用哪个历史阶段的术语？",a:"<b>新民主主义革命时期</b>（1919-1949）<br><br>❌ 不能写'社会主义现代化'——那是1978年以后的事<br>❌ 不能写'旧民主主义革命'——1919五四运动后就结束了<br><br>1928 = 井冈山 = 农村包围城市 = 新民主主义革命"},
{id:14,cat:"时间轴",q:"材料写道'1978年，安徽小岗村……'，你应该用哪组词来描述这个阶段？",a:"<b>改革开放 / 社会主义现代化建设新时期</b><br><br>配套词：十一届三中全会、以经济建设为中心、家庭联产承包责任制<br><br>注意：1978年之后才能用'社会主义现代化'。<br>如果1928年的材料你写了'社会主义现代化'，直接扣分。"},
{id:19,cat:"时间轴",q:"材料中出现以下年份，各对应什么事件？1840 / 1895 / 1911 / 1919 / 1921 / 1927 / 1937 / 1949",a:"1840 → <b>鸦片战争</b>（近代开端）<br>1895 → <b>甲午战争</b>（维新变法兴起）<br>1911 → <b>辛亥革命</b><br>1919 → <b>五四运动</b>（新旧民主革命分界）<br>1921 → <b>中共成立</b><br>1927 → 大革命失败 → <b>井冈山道路</b><br>1937 → <b>全面抗战</b><br>1949 → <b>新中国成立</b>"},
{id:15,cat:"唯物史观",q:"题目要求'用唯物史观分析辛亥革命的影响'，你写什么？",a:"<b>进步性 + 局限性并提。</b><br><br>辛亥革命<b>推翻了封建君主专制</b>，使民主共和观念深入人心；但<b>未能改变半殖民地半封建的社会性质</b>，未能实现民族独立和人民解放。<br><br>唯物史观的核心 = 辩证看待，好的一面和不足的一面都要写。"},
{id:16,cat:"唯物史观",q:"题目问'为什么中外学者对新航路开辟的评价不同'，你答哪四点？",a:"<b>1. 时代性：</b>不同时代背景下认识不同<br><b>2. 主观性：</b>立场/角度不同（欧洲学者 vs 亚非拉学者）<br><b>3. 动态演进性：</b>认识随研究深入不断变化<br><b>4. 多元价值：</b>多种观点并存有助于全面认识历史"},
{id:17,cat:"答题纪律",q:"填空题你写了'内燃机'，标准答案是'内燃机的发明与应用'。为什么扣分？",a:"<b>概念不完整。</b><br><br>历史填空必须写完整术语：<br>内燃机 ❌ → 内燃机的发明与应用 ✅<br>君主立宪 ❌ → 君主立宪制度 ✅<br>五四 ❌ → 五四运动 ✅<br><br>专有名词不缩写，动词不省略。"},
{id:18,cat:"答题纪律",q:"陶俑材料里混入了一件青花扁壶（瓷器）。这暗示了什么？你不写会怎样？",a:"<b>暗示陶俑被瓷器取代，载体本身在兴衰更替。</b><br><br>不写 = 至少扣1分。<br><br>同类情况：<br>牛马材料混入拖拉机 → 畜力被机器取代<br>信件材料混入电话 → 通讯方式变革<br><br>既要写物品见证了什么，还要写物品自身的命运。"},

{id:20,cat:"高频错误",q:"洋务运动、戊戌变法、新文化运动——按'器物→制度→思想'排顺序，你记得清吗？",a:"<b>洋务运动 → 器物（技术）</b><br>买枪炮、办工厂，只学西方技术<br><br><b>戊戌变法+辛亥革命 → 制度</b><br>发现光有技术不够，要改制度（君主立宪/民主共和）<br><br><b>新文化运动 → 思想</b><br>发现制度改了也没用，国民脑子还是封建的，要换思想<br><br>记法：<b>'洋务买了个器物，戊戌辛亥改了套制度，新文化换了颗脑袋'</b>"},
{id:21,cat:"高频错误",q:"抗日民族统一战线的'初步形成'和'正式形成'分别对应哪个年份和事件？",a:"<b>1936年 西安事变和平解决 → 初步形成</b><br><b>1937年 七七事变+国共合作宣言 → 正式形成 / 全民族抗战开始</b><br><br>差一年，差一个词，就是两个不同的得分点。<br>已经第二次错了，考前必须刻进DNA。"},
{id:22,cat:"高频错误",q:"题目让你评价科学技术的影响，你只写了'便利''进步'。阅卷老师还等什么？",a:"<b>双刃剑！消极面必须写。</b><br><br>看到'科技'两个字 → 自动弹出：<br>1. 科技是第一生产力（定调）<br>2. 积极：改变生产/生活方式，推动社会进步<br>3. <b>消极：环境污染、信息安全、贫富分化、霸权主义</b><br><br>唯物史观：任何事物都要辩证看待。"},
{id:23,cat:"高频错误",q:"分析改革开放/现代史某个现象的原因，你只写了国内因素。还漏了什么？",a:"<b>国际因素！</b><br><br>现代史原因 = <b>国内政治经济 + 国际格局外交</b><br><br>国内：十一届三中全会、改革开放、科技人才需求<br><b>国际：1979年中美建交、与西方关系缓和、第三次科技革命</b><br><br>两条腿缺一条就扣分。"},
{id:24,cat:"答题纪律",q:"你写了一篇满分小论文，内容全对。但阅卷老师一天改上千份卷子，每份只看几十秒——你的得分点埋在段落中间，老师可能没看到就跳过了。怎么让老师一秒看到？",a:"<b>核心词前置！把踩分词砸在阅卷老师脸上。</b><br><br>❌ 埋中间：'这一时期爆发了资产阶级革命，推翻了封建专制……'<br>✅ 砸脸上：<b>'第二，政治上的制度化（18-19世纪初）：</b>法国大革命推翻了封建专制……'<br><br>小论文三段式示范：<br><b>第一，空间上的全球化（16世纪）：</b>……<br><b>第二，政治上的制度化（18-19世纪初）：</b>……<br><b>第三，经济上的工业化（19世纪中后期）：</b>……<br><br>核心词前置 = 让阅卷老师一秒看到踩分点，你的答案自带高光。"},
{id:25,cat:"答题纪律",q:"题目问'材料一中认为产业革命产生了什么影响'，你自己编了'引发阶级和生活方式改变'。为什么扣分？",a:"<b>'根据材料X' = 你是一台翻译机器，不是作家。</b><br><br>答案就赤裸裸摆在材料里：<br>'这些发明推动了产业革命，产业革命同时又引起了……'→ 直接拔词翻译<br>'它首次开创了……消灭了……' → 直接拔词翻译<br><br>铁律：见'根据材料'四字 → <b>关闭大脑创作区，开启眼睛扫描模式</b>。从材料原文拔关键词，稍加书面语转述，就是满分。"},
{id:26,cat:"结构框架",q:"题目说'书籍是文明传承与进步的桥梁'，你写了古代记录文化→近代马可波罗→现在归纳理解。阅卷老师为什么说这是语文作文不是历史答题？",a:"<b>你在写时间流水账，应该拆'桥'的维度。</b><br><br>'桥梁'在历史坐标系里是<b>三个并列维度</b>，不是古代→近代→现在的时间线：<br><br><b>① 传承的载体（跨越时间）：</b>《论语》《齐民要术》把思想和技术留在纸上→后世得以继承<br><b>② 交流的桥梁（跨越空间）：</b>《马可·波罗游记》、阿拉伯翻译运动→东西方文明互通<br><b>③ 进步的动力（推动发展）：</b>后人研读前人著作→汲取智慧→创新发展<br><br>遇到'桥梁/纽带/缩影/见证'类比喻题→<b>先拆并列维度，每个维度举一个材料中的例子</b>。不要写时间流水账。"},
{id:27,cat:"结构框架",q:"题目让你给'工业革命'下一个定义，你写了'18世纪后半期起源于英国转变生产方式的产业革命'。阅卷老师说太单薄，还缺什么？",a:"<b>历史名词下定义万能公式：</b><br><br><b>时间/地点 + 核心手段 + 具体过程/波及范围 + 深远影响</b><br><br>对照你的答案，缺了三个维度：<br>时间/地点 ✅ 18世纪后半期英国<br><b>核心手段 ❌ 缺'机器生产取代手工劳动'</b><br><b>波及范围 ❌ 缺'从欧洲扩展到美洲、亚洲'</b><br><b>社会影响 ❌ 缺'引发市民社会全面变革'</b><br><br>做下定义题→先把材料拆成这四个维度，每个维度往公式里塞一条。"},
{id:28,cat:"高频错误",q:"题目问工业革命的'核心特征'，你选了'资本主义体系确立并推动全球化'。为什么错？",a:"<b>你把'核心特征'和'宏观影响'搞混了。</b><br><br>题目材料框定了范围：'指劳动组织、工业结构及整个经济活动方式的转变'<br><br><b>在这个框里：</b><br>A 工厂制（劳动组织）✅ 核心特征<br>B 农业→工业（工业结构）✅ 核心特征<br>D 资本主义全球化 ❌ <b>这是极其宏观的最终影响</b>，不在材料框定的'特征'范围里<br><br>辨析题铁律：<b>死磕题目给的限定词</b>，答案必须在那个框里。不要看到'资本主义'就激动地选。"},
{id:29,cat:"结构框架",q:"题目给你河姆渡干栏式→明清四合院→上海石库门→现代太空房四张图，问建筑演变的原因。你写了'世界多极化、对外开放对内改革'。阅卷老师为什么皱眉？",a:"<b>你把政治词汇穿越到了河姆渡时期（7000年前）！</b><br><br>长时段演变归因<b>万能三维公式</b>：<br><b>① 经济（生产力/技术）：</b>建筑技术进步、社会生产力发展<br><b>② 环境（自然地理）：</b>不同地域气候地形决定不同建筑样式<br><b>③ 文化（生活/社会/交流）：</b>生活方式改变、民族交融、东西方文化交流（石库门=中西合璧）<br><br><b>不扯政治格局！</b>河姆渡没有世界多极化，明清也没有对外开放。每个维度只写那个时代靠谱的内容。"},
{id:30,cat:"答题纪律",q:"题目给了你一幅流程图：工业革命→{社会发展+阶级矛盾+东西差距}→马克思主义。问'箭头②的含义'，你把马克思主义也写进去了。为什么扣分？",a:"<b>箭头的起点和终点就是答题的边界。越界=画蛇添足=扣分。</b><br><br>箭头②：工业革命 → {社会发展、阶级矛盾、东西差距}<br>箭头③：阶级矛盾 → 马克思主义（这是下一级箭头！）<br><br>题目只问箭头②，你就只答箭头②范围。<b>不要把箭头③的内容抢过来答。</b><br><br>看图题铁律：<b>手指着箭头起点和终点，只答这两个端点之间的内容。</b>"},
{id:31,cat:"术语翻译",q:"你在答工业革命影响时连用了三个'造成了'：'造成了社会发展、造成了阶级矛盾、造成了先进西方落后东方'。阅卷老师看吐了，换个什么词？",a:"<b>历史答题不是'造成了'造句大赛。</b><br><br>动词升级表：<br>'造成了' → <b>推动了 / 带来了 / 引发了</b><br>'变好了' → <b>促进了……的发展</b><br>'变差了' → <b>加剧了……的矛盾 / 激化了……的冲突</b><br>'影响了' → <b>拉大了……的差距 / 形成了……的局面</b><br><br>同一段话换动词示范：<br>❌ 造成了社会发展，造成了阶级矛盾，造成了东西差距<br>✅ <b>推动了</b>社会变革，<b>带来了</b>新的阶级矛盾，<b>拉大了</b>东西方发展差距"},
{id:32,cat:"结构框架",q:"你在布展题里选了东罗马金币和《洛阳伽蓝记》来证明中外交流。除了内容都对，还有什么让阅卷老师眼前一亮的高阶论证？",a:"<b>史料分类互证——实物史料+文献史料，孤证不立。</b><br><br>B（东罗马金币）= <b>实物史料</b>——直观的货币流通证据<br>C（《洛阳伽蓝记》）= <b>文献史料</b>——文字记载商胡贩客往来场景<br>鎏金银壶 = 实物史料（器物本身）<br><br>三种证据分属不同类型，却指向同一个结论：<b>北朝中外交流频繁</b>。<br><br>论证公式：<b>实物史料提供直观证据 + 文献史料提供文字佐证 → 多重证据相互印证 → 结论更可靠。</b><br><br>这一招在布展题、材料分析题里都是降维打击。"},
{id:33,cat:"结构框架",q:"题目给你一幅东汉击鼓说唱俑的图，让你写一段赏析。你写了'泥塑水平高超，反映民间生活气息'。阅卷老师说还差一半分，缺了什么？",a:"<b>文物赏析双视角：表层信息 + 隐性信息。</b><br><br><b>① 表层（直接可见）：</b>材质（陶/泥塑）、工艺（写实/夸张/线条）、造型（击鼓动作/表情）、场景（说唱表演）<br><b>② 隐性（历史解读）：</b>时代背景（东汉商品经济）、社会制度（陪葬制度）、阶级状况（市民阶层兴起）、文化内涵（民间艺术繁荣）<br><br>两个视角各写一段。只写表层=2分，写了隐性=3分。<br>记法：<b>'看一眼写一句（表层），想一下再写一句（隐性）'</b>"},
{id:34,cat:"答题纪律",q:"Q8问工业革命的影响，题目开头写着'综合上述材料'。你写了生产力飞跃✅，又写了二氧化碳污染和贫富差距。为什么后面两点扣分？",a:"<b>'综合上述材料'=答案只能在材料里长出来。</b><br><br>材料一：纺纱机促进生产<br>材料二：《共产党宣言》说它创造了巨大生产力<br>材料三：棉布、煤炭、生铁产量数据<br><br>三段材料哪个字提了<b>环境污染</b>？提了<b>贫富差距</b>？——都没有！<br><br>你写的内容历史上是对的，但考场上是错的。<br>铁律：<b>材料给了什么证据，就只提炼什么结论。</b>不脑补，不发挥，哪怕脑补的内容历史书上白纸黑字写着。"},
{id:35,cat:"答题纪律",q:"题目给你一张工业革命流程图：棉纺织→蒸汽机→机器制造业→交通运输。问'相互关系'，你写了蒸汽机如何影响工厂制。为什么没拿满分？",a:"<b>箭头不是装饰，是因果逻辑。你必须顺着箭头的方向写A→B→C。</b><br><br>❌ 跳过起点：'蒸汽机确立了工厂制，出现了机器制造业……'（从B开始写）<br>✅ 从起点出发：<b>'棉纺织业高速发展→对新动力提出需求→促使瓦特改良蒸汽机→蒸汽机催生机器制造业→机器制造业推动交通运输变革'</b><br><br>每个箭头翻译成一句因果：<br>A→B：A的发展<b>倒逼/提出了对B的需求</b><br>B→C：B的突破<b>催生了/推动了C</b><br><br>不漏箭头，不跳步，顺着走。"},
{id:36,cat:"答题纪律",q:"题目给了四组展品让你匹配'丧葬观念''早期文字''工艺水平''军事武力'。你把太阳船和陶屋配给了'早期文字'，把石碑配给了'丧葬观念'。为什么全错？",a:"<b>材料配对的本质是关键词翻译，不是凭感觉猜。</b><br><br>配对翻译表：<br>见'墓葬''死者''陪葬''永恒' → <b>丧葬观念/死后世界</b><br>见'石碑''经文''刻字''典籍' → <b>文字/文献</b><br>见'器物''工具''建筑模型' → <b>工艺水平/生产技术</b><br>见'武器''战车''铠甲' → <b>军事/武力</b><br><br>太阳船+'帮助死者实现永恒'→ 丧葬 ✅<br>双语石碑+熹平石经（全是字）→ 文字 ✅<br><br>做配对题：<b>先读材料描述里的关键词，再翻译成黑体字类别。</b>"},

];

const cats = [...new Set(cards.map(c=>c.cat))];
let mode='card', filter='all', idx=0, filtered=[...cards];
let mastered=load('mastered'), unfamiliar=load('unfamiliar');

function load(k){try{return JSON.parse(localStorage.getItem(STORE+'_'+k))||{}}catch(e){return{}}}
function save(){localStorage.setItem(STORE+'_mastered',JSON.stringify(mastered));localStorage.setItem(STORE+'_unfamiliar',JSON.stringify(unfamiliar))}
function getFiltered(){
let a=filter==='all'?[...cards]:cards.filter(c=>c.cat===filter);
let q=document.getElementById('searchBox').value.toLowerCase();
if(q)a=a.filter(c=>c.q.toLowerCase().includes(q)||c.a.toLowerCase().includes(q));
return a;
}
function updateStats(){
filtered=getFiltered();
document.getElementById('tN').textContent=filtered.length;
let m=filtered.filter(c=>mastered[c.id]).length;
let u=filtered.filter(c=>unfamiliar[c.id]).length;
let p=filtered.length?Math.round(m/filtered.length*100):0;
document.getElementById('mN').textContent=m;
document.getElementById('uN').textContent=u;
document.getElementById('pP').textContent=p+'%';
document.getElementById('pFill').style.width=p+'%';
}
function renderCard(){
if(filtered.length===0){document.getElementById('cQ').textContent='没有匹配的卡片';document.getElementById('cA').innerHTML='';return}
if(idx>=filtered.length)idx=0;
let c=filtered[idx];
document.getElementById('cBadge').textContent=c.cat;
document.getElementById('cId').textContent=idx+1+'/'+filtered.length;
document.getElementById('cQ').textContent=c.q;
document.getElementById('cA').innerHTML=c.a;
let card=document.getElementById('card');
card.classList.remove('flipped','mastered','unfamiliar');
if(mastered[c.id])card.classList.add('mastered');
if(unfamiliar[c.id])card.classList.add('unfamiliar');
}
function flip(){document.getElementById('card').classList.toggle('flipped')}
function mark(t){
let c=filtered[idx];if(!c)return;
delete mastered[c.id];delete unfamiliar[c.id];
if(t==='mastered')mastered[c.id]=true;
if(t==='unfamiliar')unfamiliar[c.id]=true;
save();updateStats();renderCard();buildList();buildError();buildSummary();
}
function nextCard(){if(filtered.length){idx=(idx+1)%filtered.length;renderCard()}}
function prevCard(){if(filtered.length){idx=(idx-1+filtered.length)%filtered.length;renderCard()}}
function randomCard(){if(filtered.length){idx=Math.floor(Math.random()*filtered.length);renderCard();flip()}}
function applySearch(){updateStats();idx=0;renderCard();buildList()}

function buildList(){
let lv=document.getElementById('listView');
let html='';
cats.forEach(cat=>{
let cs=cards.filter(c=>c.cat===cat);
if(!filtered.filter(c=>c.cat===cat).length)return;
html+='<div class="g"><h3>'+cat+' ('+cs.length+')</h3>';
cs.forEach(c=>{
let cls='it';if(mastered[c.id])cls+=' mastered';if(unfamiliar[c.id])cls+=' unfamiliar';
html+='<div class="'+cls+'" onclick="this.classList.toggle(\'on\')"><div class="iq">'+c.q+'</div><div class="ia">'+c.a+'</div></div>';
});
html+='</div>';
});
lv.innerHTML=html||'<p>无匹配</p>';
}

function buildError(){
let errs=cards.filter(c=>unfamiliar[c.id]);
document.getElementById('errCount').textContent=errs.length;
let el=document.getElementById('errList');
el.innerHTML=errs.map((c,i)=>
'<div class="ei" onclick="jumpToCard('+c.id+')"><div class="eq">'+(i+1)+'. '+c.q+'</div><div class="ea">'+c.a+'</div></div>'
).join('')||'暂无待复习卡片';
}

function buildSummary(){
let total=cards.length,m=cards.filter(c=>mastered[c.id]).length;
document.getElementById('sPct').textContent=(total?Math.round(m/total*100):0)+'%';
let st=document.getElementById('sTable');
st.innerHTML=cats.map(cat=>{
let cs=cards.filter(c=>c.cat===cat);
let cm=cs.filter(c=>mastered[c.id]).length;
let p=cs.length?Math.round(cm/cs.length*100):0;
return'<tr><td class="cname">'+cat+'</td><td>'+cm+'/'+cs.length+'</td><td><div class="cbar"><div class="cfill" style="width:'+p+'%"></div></div></td></tr>';
}).join('');
}

function jumpToCard(id){
switchMode('card');
filter='all';document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
document.querySelector('.cat-btn[data-cat="all"]').classList.add('active');
updateStats();
let ci=filtered.findIndex(c=>c.id===id);
if(ci>=0)idx=ci;
renderCard();
}

function switchMode(m){
mode=m;
document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
document.getElementById('cardView').style.display=m==='card'?'block':'none';
document.getElementById('listView').className='lv'+(m==='list'?' on':'');
document.getElementById('errorView').className='ev'+(m==='error'?' on':'');
document.getElementById('summaryView').className='sv'+(m==='summary'?' on':'');
document.getElementById('searchBox').style.display=(m==='card'||m==='list')?'block':'none';
if(m==='list')buildList();
if(m==='error')buildError();
if(m==='summary')buildSummary();
}

function clearErrors(){unfamiliar={};save();updateStats();renderCard();buildList();buildError();buildSummary()}
function resetAll(){mastered={};unfamiliar={};save();updateStats();renderCard();buildList();buildError();buildSummary()}

// init
filtered=getFiltered();
let cn=document.getElementById('catNav');
cn.innerHTML='<button class="cat-btn active" data-cat="all" onclick="setFilter(\'all\')">全部<span class="ct">'+cards.length+'</span></button>';
cats.forEach(c=>{
