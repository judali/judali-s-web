<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>人物事迹配对 · 中考历史</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;background:#1a1a2e;color:#eee;min-height:100vh;overflow-x:hidden}
.screen{display:none;min-height:100vh;flex-direction:column;align-items:center}
.screen.active{display:flex}
#startScreen{justify-content:center;padding:40px 20px;text-align:center;background:radial-gradient(ellipse at top,#1a1a2e 30%,#0d0d1a 100%)}
#startScreen .logo{font-size:4em;margin-bottom:10px;animation:bounce 1.5s infinite}
#startScreen h1{font-size:1.6em;background:linear-gradient(135deg,#6c5ce7,#a29bfe);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
#startScreen .sub{color:#aaa;font-size:.9em;margin-bottom:6px;line-height:1.6}
#startScreen .sub em{color:#a29bfe;font-style:normal}
#startScreen .high{background:#6c5ce7;color:#fff;padding:2px 8px;border-radius:4px;font-weight:700}
.start-btn{padding:14px 48px;font-size:1.1em;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;border:none;border-radius:30px;cursor:pointer;font-weight:700;letter-spacing:1px;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 20px rgba(108,92,231,.3);margin:8px}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(108,92,231,.45)}
.start-btn:active{transform:scale(.96)}
.book-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:520px;margin:16px 0}
.book-btn{background:#16213e;border:2px solid #2a3a5c;color:#ccc;border-radius:14px;padding:13px 18px;cursor:pointer;transition:.15s;text-align:center;min-width:110px}
.book-btn:hover{border-color:#a29bfe;color:#a29bfe;transform:translateY(-1px)}
.book-btn .bn{font-size:1.05em;font-weight:700;display:block;margin-bottom:2px}
.book-btn .bm{font-size:.68em;color:#888}
.book-btn.all{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;border-color:#6c5ce7;font-weight:700}
.book-btn.all .bm{color:rgba(255,255,255,.8)}
.back-btn{display:inline-block;margin-top:14px;color:#666;cursor:pointer;font-size:.8em;text-decoration:underline;transition:.15s}
.back-btn:hover{color:#a29bfe}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

.game-header{width:100%;background:linear-gradient(135deg,#16213e,#0f3460);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.game-header .lvl{font-size:.85em;color:#a29bfe;font-weight:700}
.game-header .stats-row{display:flex;gap:12px;align-items:center}
.game-header .stat{text-align:center}
.game-header .stat .v{font-size:1.1em;font-weight:700;color:#a29bfe}
.game-header .stat .l{font-size:.6em;color:#999}
.hint-btn{padding:6px 14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#ccc;border-radius:14px;cursor:pointer;font-size:.75em;transition:.15s}
.hint-btn:hover{background:rgba(255,255,255,.2)}
.hint-btn:disabled{opacity:.3;cursor:not-allowed}

.game-main{flex:1;width:100%;max-width:680px;padding:16px 14px 40px;display:flex;flex-direction:column;align-items:center}
.lvl-title{text-align:center;margin-bottom:4px}
.lvl-title h2{font-size:1.1em;color:#a29bfe;margin-bottom:4px}
.lvl-title .lvl-sub{font-size:.75em;color:#999}
.progress-dots{display:flex;gap:4px;margin:8px 0 16px;flex-wrap:wrap;justify-content:center}
.progress-dots .dot{width:8px;height:8px;border-radius:50%;background:#333;transition:.3s}
.progress-dots .dot.done{background:#6c5ce7}
.progress-dots .dot.current{background:#a29bfe;box-shadow:0 0 8px rgba(108,92,231,.5)}

.columns{display:flex;gap:16px;width:100%}
.column{flex:1;display:flex;flex-direction:column;gap:8px}
.column-label{text-align:center;font-size:.72em;color:#666;margin-bottom:2px;text-transform:uppercase;letter-spacing:1px}

.match-card{background:#16213e;border:2px solid #2a3a5c;border-radius:12px;padding:13px 14px;cursor:pointer;transition:all .2s;user-select:none;-webkit-tap-highlight-color:transparent;font-size:.85em;text-align:center;line-height:1.4;min-height:50px;display:flex;align-items:center;justify-content:center}
.match-card:hover{border-color:#6c5ce7;background:#1c2b4a}
.match-card:active{transform:scale(.97)}
.match-card.selected{border-color:#a29bfe;background:#1c1b4a;box-shadow:0 0 12px rgba(108,92,231,.3)}
.match-card.matched{background:#0d2818;border-color:#28a745;color:#98e288;pointer-events:none;opacity:.8}
.match-card.wrong-flash{animation:shake .4s ease;border-color:#dc3545!important;background:#280d0d!important}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

.feedback-area{width:100%;text-align:center;margin-top:12px;min-height:32px}
.feedback-area .msg{font-size:.85em;color:#aaa;transition:.2s}
.feedback-area .msg.good{color:#28a745}
.feedback-area .msg.bad{color:#dc3545}

.next-btn{padding:10px 32px;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;border:none;border-radius:20px;cursor:pointer;font-weight:700;font-size:.9em;transition:.15s;display:none}
.next-btn.show{display:inline-block}
.next-btn:hover{transform:scale(1.04)}

#endScreen{justify-content:center;padding:40px 20px;text-align:center}
#endScreen .trophy{font-size:5em;margin-bottom:10px}
#endScreen h2{font-size:1.4em;color:#a29bfe;margin-bottom:4px}
#endScreen .total-score{font-size:2.4em;font-weight:700;color:#a29bfe;margin:10px 0}
#endScreen .end-stats{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:16px 0}
#endScreen .end-stat{background:#16213e;border-radius:12px;padding:14px 20px;text-align:center}
#endScreen .end-stat .v{font-size:1.4em;font-weight:700;color:#a29bfe}
#endScreen .end-stat .l{font-size:.7em;color:#999;margin-top:2px}

@media(max-width:500px){
  #startScreen h1{font-size:1.2em}
  .match-card{padding:11px 10px;font-size:.78em;min-height:44px}
  .columns{gap:8px}
  .game-header{padding:10px 12px}
}
</style>
</head>
<body>

<!-- START SCREEN -->
<div class="screen active" id="startScreen">
  <div class="logo">👥</div>
  <h1>人物事迹配对 · 中考历史</h1>
  <p class="sub">将<em>历史人物</em>与其<span class="high">主要事迹</span>配对<br>覆盖六册课本核心人物</p>
  <p style="color:#999;font-size:.8em;margin-bottom:4px">选择挑战范围：</p>
  <div class="book-grid">
    <button class="book-btn all" onclick="startGame('all')"><span class="bn">📚 全部挑战</span><span class="bm">21关 · 160+人物</span></button>
    <button class="book-btn" onclick="startGame('古')"><span class="bn">🏯 中国古代</span><span class="bm">1-2册 · 7关</span></button>
    <button class="book-btn" onclick="startGame('近')"><span class="bn">📰 中国近现代</span><span class="bm">3-4册 · 7关</span></button>
    <button class="book-btn" onclick="startGame('世')"><span class="bn">🌍 世界史</span><span class="bm">5-6册 · 7关</span></button>
  </div>
  <p style="color:#666;font-size:.7em;margin-top:8px">先点人物 → 再点事迹 → 配对成功！</p>
</div>

<!-- GAME SCREEN -->
<div class="screen" id="gameScreen">
  <div class="game-header">
    <button class="hint-btn" onclick="backToMenu()">← 返回</button>
    <div class="lvl" id="lvlLabel">第1关</div>
    <div class="stats-row">
      <div class="stat"><div class="v" id="scoreDisplay">0</div><div class="l">得分</div></div>
      <div class="stat"><div class="v" id="comboDisplay">0</div><div class="l">连对</div></div>
      <button class="hint-btn" id="hintBtn" onclick="useHint()">💡<span id="hintCount">3</span></button>
    </div>
  </div>
  <div class="game-main">
    <div class="lvl-title"><h2 id="lvlTitle"></h2><div class="lvl-sub" id="lvlSub"></div></div>
    <div class="progress-dots" id="progressDots"></div>
    <div class="columns">
      <div class="column">
        <div class="column-label">👤 人物</div>
        <div id="personCol"></div>
      </div>
      <div class="column">
        <div class="column-label">📜 主要事迹</div>
        <div id="deedCol"></div>
      </div>
    </div>
    <div class="feedback-area"><span class="msg" id="feedbackMsg"></span></div>
    <button class="next-btn" id="nextBtn" onclick="nextLevel()">下一关 ›</button>
  </div>
</div>

<!-- END SCREEN -->
<div class="screen" id="endScreen">
  <div class="trophy" id="endTrophy">🏆</div>
  <h2 id="endTitle">全部完成！</h2>
  <div class="total-score" id="endScore">0</div>
  <p style="color:#aaa;font-size:.85em">总分</p>
  <div class="end-stats">
    <div class="end-stat"><div class="v" id="endPerfect">0</div><div class="l">完美关</div></div>
    <div class="end-stat"><div class="v" id="endBest">0</div><div class="l">最高连对</div></div>
    <div class="end-stat"><div class="v" id="endTotalPairs">0</div><div class="l">总配对数</div></div>
  </div>
  <button class="start-btn" style="margin-top:12px" onclick="retryBook()">🔄 再战同一范围</button>
  <div class="back-btn" onclick="backToMenu()">← 返回选范围</div>
</div>

// Level-based game state
let currentLevel=0,totalScore=0,combo=0,bestCombo=0,totalPairs=0,perfectLevels=0,hintsLeft=3;
let selectedPerson=null,pairsRemaining=0,activeLevels=[];

// ==================== GAME ENGINE ====================
function startGame(book){
  if(book==='all'){activeLevels=[...allLevels];}
  else{activeLevels=allLevels.filter(l=>l.bk===book);}
  if(!activeLevels.length){alert('该范围暂无关卡');return;}
  currentLevel=0;totalScore=0;combo=0;bestCombo=0;totalPairs=0;perfectLevels=0;hintsLeft=3;
  document.getElementById('startScreen').classList.remove('active');
  document.getElementById('endScreen').classList.remove('active');
  document.getElementById('gameScreen').classList.add('active');
  document.getElementById('hintCount').textContent=hintsLeft;
  updateHeaderStats();
  loadLevel(0);
}

function loadLevel(idx){
  if(idx>=activeLevels.length){showEndScreen();return;}
  currentLevel=idx;selectedPerson=null;
  let lvl=activeLevels[idx];
  pairsRemaining=lvl.pairs.length;
  document.getElementById('lvlLabel').textContent='第'+(idx+1)+'/'+activeLevels.length+'关';
  document.getElementById('lvlTitle').textContent=lvl.title;
  document.getElementById('lvlSub').textContent=lvl.sub;
  document.getElementById('feedbackMsg').textContent='';
  document.getElementById('feedbackMsg').className='msg';
  document.getElementById('nextBtn').classList.remove('show');

  let dots='';
  for(let i=0;i<activeLevels.length;i++){
    let cls=i<idx?'done':(i===idx?'current':'');
    dots+='<div class="dot '+cls+'"></div>';
  }
  document.getElementById('progressDots').innerHTML=dots;

  // Shuffle persons and deeds independently
  let persons=[...lvl.pairs.map((p,i)=>({text:p[0], key:i}))];
  let deeds=[...lvl.pairs.map((p,i)=>({text:p[1], key:i}))];
  shuffle(persons); shuffle(deeds);

  let pHtml='',dHtml='';
  persons.forEach(p=>{
    pHtml+='<div class="match-card person-card" data-key="'+p.key+'" data-text="'+esc(p.text)+'" onclick="selectPerson(this)">'+p.text+'</div>';
  });
  deeds.forEach(d=>{
    dHtml+='<div class="match-card deed-card" data-key="'+d.key+'" data-text="'+esc(d.text)+'" onclick="selectDeed(this)">'+d.text+'</div>';
  });
  document.getElementById('personCol').innerHTML=pHtml;
  document.getElementById('deedCol').innerHTML=dHtml;
}

function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
function esc(s){return s.replace(/"/g,'&quot;').replace(/</g,'&lt;');}

function selectPerson(el){
  if(el.classList.contains('matched'))return;
  // Deselect previous
  document.querySelectorAll('.person-card.selected').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  selectedPerson=el;
  document.getElementById('feedbackMsg').textContent='已选：'+el.dataset.text+' → 请点右侧事迹';
  document.getElementById('feedbackMsg').className='msg';
}

function selectDeed(el){
  if(el.classList.contains('matched'))return;
  if(!selectedPerson){document.getElementById('feedbackMsg').textContent='👆 请先点击左侧人物';document.getElementById('feedbackMsg').className='msg bad';return;}

  let personKey=selectedPerson.dataset.key;
  let deedKey=el.dataset.key;

  if(personKey===deedKey){
    // Correct match!
    selectedPerson.classList.add('matched');
    selectedPerson.classList.remove('selected');
    el.classList.add('matched');
    selectedPerson=null;
    pairsRemaining--;
    combo++;
    if(combo>bestCombo)bestCombo=combo;
    totalPairs++;

    let points=10+(combo>=5?5:0)+(combo>=10?5:0);
    totalScore+=points;
    updateHeaderStats();

    document.getElementById('feedbackMsg').textContent='✅ 正确！'+el.dataset.text+(combo>=5?' 🔥'+combo+'连对！':'');
    document.getElementById('feedbackMsg').className='msg good';

    if(pairsRemaining===0){
      if(combo===activeLevels[currentLevel].pairs.length){perfectLevels++;}
      document.getElementById('nextBtn').classList.add('show');
      document.getElementById('feedbackMsg').textContent='🎉 全部配对成功！+'+totalScore+'分';
    }
  }else{
    // Wrong match
    selectedPerson.classList.add('wrong-flash');
    el.classList.add('wrong-flash');
    combo=0;
    updateHeaderStats();
    document.getElementById('feedbackMsg').textContent='❌ 配对错误，请重试';
    document.getElementById('feedbackMsg').className='msg bad';
    setTimeout(()=>{
      selectedPerson.classList.remove('wrong-flash','selected');
      el.classList.remove('wrong-flash');
      selectedPerson=null;
    },400);
  }
}

function useHint(){
  if(hintsLeft<=0||pairsRemaining===0)return;
  hintsLeft--;
  document.getElementById('hintCount').textContent=hintsLeft;
  if(hintsLeft<=0)document.getElementById('hintBtn').disabled=true;

  // Find an unmatched pair and reveal it
  let unmatchedPersons=document.querySelectorAll('.person-card:not(.matched)');
  let unmatchedDeeds=document.querySelectorAll('.deed-card:not(.matched)');
  let found=false;
  unmatchedPersons.forEach(p=>{
    if(found||p.classList.contains('wrong-flash'))return;
    unmatchedDeeds.forEach(d=>{
      if(found||d.classList.contains('wrong-flash'))return;
      if(p.dataset.key===d.dataset.key){
        p.classList.add('selected');
        setTimeout(()=>{
          d.classList.add('matched');
          p.classList.add('matched');
          p.classList.remove('selected');
          pairsRemaining--;
          totalPairs++;
          totalScore+=5;
          updateHeaderStats();
          if(pairsRemaining===0){
            document.getElementById('nextBtn').classList.add('show');
            document.getElementById('feedbackMsg').textContent='🎉 全部配对成功！（用了提示）';
            document.getElementById('feedbackMsg').className='msg good';
          }
        },600);
        found=true;
      }
    });
  });
}

function updateHeaderStats(){
  document.getElementById('scoreDisplay').textContent=totalScore;
  document.getElementById('comboDisplay').textContent=combo;
}

function nextLevel(){
  combo=0;updateHeaderStats();
  loadLevel(currentLevel+1);
}

function backToMenu(){
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('endScreen').classList.remove('active');
  document.getElementById('startScreen').classList.add('active');
}

function retryBook(){
  currentLevel=0;totalScore=0;combo=0;bestCombo=0;totalPairs=0;perfectLevels=0;hintsLeft=3;
  document.getElementById('hintCount').textContent=hintsLeft;
  document.getElementById('hintBtn').disabled=false;
  document.getElementById('endScreen').classList.remove('active');
  document.getElementById('gameScreen').classList.add('active');
  updateHeaderStats();
  loadLevel(0);
}

function showEndScreen(){
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('endScreen').classList.add('active');
  document.getElementById('endScore').textContent=totalScore;
  document.getElementById('endPerfect').textContent=perfectLevels;
  document.getElementById('endBest').textContent=bestCombo;
  document.getElementById('endTotalPairs').textContent=totalPairs;
  let pct=perfectLevels/activeLevels.length;
  if(pct>=0.9){document.getElementById('endTrophy').textContent='🏆';document.getElementById('endTitle').textContent='完美通关！';}
  else if(pct>=0.6){document.getElementById('endTrophy').textContent='🌟';document.getElementById('endTitle').textContent='优秀通关！';}
  else if(pct>=0.3){document.getElementById('endTrophy').textContent='📚';document.getElementById('endTitle').textContent='还需努力！';}
  else{document.getElementById('endTrophy').textContent='💪';document.getElementById('endTitle').textContent='继续加油！';}
}
