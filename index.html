<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>中考历史 · 术语翻卡背诵</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333;min-height:100vh}

.header{background:linear-gradient(135deg,#8b4513,#a0522d,#cd853f);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.header h1{font-size:1.25em;text-align:center;margin-bottom:2px}
.header .sub{text-align:center;font-size:.75em;opacity:.8}
.stats{display:flex;justify-content:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.stats .s{background:rgba(255,255,255,.15);border-radius:10px;padding:5px 12px;text-align:center;min-width:64px}
.stats .s .n{font-size:1.2em;font-weight:700}
.stats .s .l{font-size:.62em;opacity:.8}

.cat-nav{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:10px 14px 6px;position:sticky;top:116px;z-index:99;background:#f0f2f5;-webkit-overflow-scrolling:touch;scrollbar-width:none;justify-content:center}
.cat-nav::-webkit-scrollbar{display:none}
.cat-btn{padding:5px 12px;border-radius:18px;border:2px solid #d0d5dd;background:#fff;cursor:pointer;font-size:.82em;transition:.2s;white-space:nowrap;flex-shrink:0}
.cat-btn:hover{border-color:#a0522d;color:#a0522d}
.cat-btn.active{background:#a0522d;color:#fff;border-color:#a0522d}
.cat-btn .ct{font-size:.68em;opacity:.7;margin-left:2px}

.main{max-width:780px;margin:0 auto;padding:8px 14px 50px}
.modes{display:flex;gap:6px;margin-bottom:12px;justify-content:center;flex-wrap:wrap}
.mode-btn{padding:7px 14px;border-radius:10px;border:2px solid #d0d5dd;background:#fff;cursor:pointer;font-size:.83em;transition:.2s}
.mode-btn.active{background:#a0522d;color:#fff;border-color:#a0522d}

.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px}
.search{flex:1;min-width:160px;padding:8px 14px;border-radius:10px;border:2px solid #d0d5dd;font-size:.9em;outline:none}
.search:focus{border-color:#a0522d}
.search{display:none}
.toolbar-right{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.auto-adv{display:flex;align-items:center;gap:4px;font-size:.8em;color:#666;cursor:pointer;white-space:nowrap}
.auto-adv input{accent-color:#a0522d;width:14px;height:14px;cursor:pointer}

.pbar{height:4px;background:#e0e0e0;border-radius:2px;margin-bottom:12px}
.pfill{height:100%;background:#a0522d;border-radius:2px;transition:width .4s}

/* ===== CARD ===== */
.card-wrap{margin-bottom:10px;touch-action:pan-y}
.card{background:#fff;border-radius:16px;padding:28px 22px 22px;cursor:pointer;min-height:170px;box-shadow:0 3px 14px rgba(0,0,0,.07);transition:box-shadow .25s,border-color .25s,background .3s;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:3px solid #e8e8e8;user-select:none;-webkit-tap-highlight-color:transparent}
.card:active{transform:scale(.99)}
.card.mastered{border-color:#28a745;background:#f6fff8}
.card.unfamiliar{border-color:#ffc107;background:#fffbf0}
.card .badge{position:absolute;top:10px;left:12px;background:#a0522d;color:#fff;padding:2px 9px;border-radius:9px;font-size:.68em}
.card .cid{position:absolute;top:10px;right:12px;color:#aaa;font-size:.72em}
.card .q{font-size:1.06em;line-height:1.75;color:#1a1a2e;padding:0 6px}
.card .hint{font-size:.68em;color:#ccc;margin-top:12px}

/* answer reveal animation */
.card .a{display:none;font-size:.98em;line-height:1.85;color:#2d5016;padding-top:14px;border-top:2px dashed #e0e0e0;margin-top:14px;width:100%;text-align:left}
.card .a b{color:#a0522d}
.card.flipped .a{display:block;animation:answerIn .25s ease}
.card.flipped .q{color:#888;font-size:.88em;opacity:.65;transition:all .25s}
.card.flipped .hint{display:none}
.card.flipped{background:#fafff5;border-color:#b8dbc0}
.card.flipped.mastered{background:#f0fff4;border-color:#28a745}
.card.flipped.unfamiliar{background:#fffbf0;border-color:#ffc107}

@keyframes answerIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

.swipe-hint{text-align:center;font-size:.7em;color:#bbb;margin-bottom:6px;display:none}

.actions{display:flex;gap:7px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.a-btn{padding:8px 15px;border-radius:8px;border:none;cursor:pointer;font-size:.83em;transition:.15s;font-weight:500}
.a-unf{background:#fff3cd;color:#856404}
.a-unf:hover{background:#ffeaa7}
.a-done{background:#d4edda;color:#155724}
.a-done:hover{background:#c3e6cb}
.a-clear{background:#f8d7da;color:#721c24}
.a-clear:hover{background:#f5c6cb}
.a-rand{background:#e2e3e5;color:#383d41}
.a-rand:hover{background:#d6d8d9}
.a-flip{background:#e8f0fe;color:#1a56db}
.a-flip:hover{background:#d0e2fd}

.nav-btns{display:flex;justify-content:center;gap:10px;margin-top:10px}
.nav-btn{padding:10px 28px;border-radius:10px;border:none;cursor:pointer;font-size:.92em;background:#a0522d;color:#fff;transition:.2s}
.nav-btn:hover{background:#8b4513}
.nav-btn:disabled{background:#ccc;cursor:not-allowed}
.nav-btn.sec{background:#fff;color:#a0522d;border:2px solid #a0522d}

.key-hints{text-align:center;font-size:.68em;color:#bbb;margin-top:8px}
.key-hints kbd{background:#f0f0f0;border:1px solid #ccc;border-radius:4px;padding:1px 5px;font-size:.9em;color:#555}

/* list mode */
.lv{display:none}
.lv.on{display:block}
.lv .g{margin-bottom:20px}
.lv .g h3{font-size:.95em;color:#a0522d;padding:6px 12px;background:#f5e6d3;border-radius:8px;margin-bottom:7px}
.lv .it{background:#fff;border-radius:10px;padding:13px 16px;margin-bottom:5px;box-shadow:0 1px 3px rgba(0,0,0,.04);cursor:pointer;border-left:4px solid #e0e0e0;transition:.15s}
.lv .it.mastered{border-left-color:#28a745;background:#f8fff9}
.lv .it.unfamiliar{border-left-color:#ffc107;background:#fffbf0}
.lv .it .iq{font-weight:600;margin-bottom:3px;font-size:.93em}
.lv .it .ia{display:none;color:#2d5016;line-height:1.65;padding-top:6px;border-top:1px solid #eee;font-size:.9em}
.lv .it.on .ia{display:block}

/* error mode */
.ev{display:none;background:#fff;border-radius:14px;padding:20px;box-shadow:0 3px 12px rgba(0,0,0,.06)}
.ev.on{display:block}
.ev h2{color:#a0522d;margin-bottom:12px}
.ev .el{max-height:420px;overflow-y:auto}
.ev .ei{padding:10px 13px;background:#fffbf0;border-left:4px solid #ffc107;margin-bottom:6px;border-radius:6px;cursor:pointer}
.ev .ei .eq{font-weight:600;color:#856404;margin-bottom:3px;font-size:.9em}
.ev .ei .ea{font-size:.82em;color:#555}

/* summary */
.sv{display:none;background:#fff;border-radius:14px;padding:24px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.06)}
.sv.on{display:block}
.sv .big{font-size:2.4em;font-weight:700;color:#a0522d}
.sv table{width:100%;border-collapse:collapse;margin-top:14px}
.sv td{padding:6px 8px;text-align:left;font-size:.88em}
.sv .cname{font-weight:600}
.sv .cbar{background:#f5e6d3;border-radius:6px;height:16px;overflow:hidden}
.sv .cfill{height:100%;background:linear-gradient(90deg,#a0522d,#8b4513);border-radius:6px;transition:width .5s}

@media(max-width:600px){
  .header h1{font-size:1.1em}
  .stats{gap:5px}
  .stats .s{padding:4px 7px;min-width:52px}
  .stats .s .n{font-size:1em}
  .cat-nav{justify-content:flex-start}
  .card{padding:22px 16px 18px;min-height:150px}
  .card .q{font-size:1em}
  .swipe-hint{display:block}
  .key-hints{display:none}
  .nav-btns{gap:8px}
  .nav-btn{padding:9px 20px;font-size:.88em}
}
</style>
</head>
<body>

<div class="header">
  <h1>中考历史 · 术语翻卡背诵</h1>
  <p class="sub">考点1-30 · 标准术语 · 开卷也翻不出的规范表达</p>
  <div class="stats">
    <div class="s"><div class="n" id="tN">0</div><div class="l">总卡</div></div>
    <div class="s"><div class="n" id="mN">0</div><div class="l">已掌握</div></div>
    <div class="s"><div class="n" id="uN">0</div><div class="l">待复习</div></div>
    <div class="s"><div class="n" id="pP">0%</div><div class="l">掌握率</div></div>
  </div>
</div>

<div class="cat-nav" id="catNav"></div>

<div class="main">
  <div class="modes">
    <button class="mode-btn active" onclick="switchMode('card')">卡片</button>
    <button class="mode-btn" onclick="switchMode('list')">列表</button>
    <button class="mode-btn" onclick="switchMode('error')">待复习</button>
    <button class="mode-btn" onclick="switchMode('summary')">掌握度</button>
  </div>

  <div class="toolbar" id="toolbarRow">
    <input class="search" id="searchBox" placeholder="搜索术语关键词..." oninput="applySearch()">
    <div class="toolbar-right">
      <button class="a-btn a-unf" id="btnUnfOnly" onclick="toggleUnfamiliarOnly()" style="display:none">只看不熟悉</button>
      <label class="auto-adv" id="autoAdvLabel" style="display:none">
        <input type="checkbox" id="autoAdv"> 标记后自动下一张
      </label>
    </div>
  </div>

  <div class="pbar"><div class="pfill" id="pFill" style="width:0%"></div></div>

  <!-- card mode -->
  <div id="cardView">
    <p class="swipe-hint">← → 滑动翻页 · 点击翻转</p>
    <div class="card-wrap" id="cardWrap">
      <div class="card" id="card" onclick="flip()">
        <div class="badge" id="cBadge"></div>
        <div class="cid" id="cId"></div>
        <div class="q" id="cQ"></div>
        <div class="a" id="cA"></div>
        <div class="hint">点击卡片翻转查看答案</div>
      </div>
    </div>
    <div class="actions">
      <button class="a-btn a-unf" onclick="mark('unfamiliar')">不熟悉</button>
      <button class="a-btn a-done" onclick="mark('mastered')">已掌握</button>
      <button class="a-btn a-clear" onclick="mark('none')">清除标记</button>
      <button class="a-btn a-rand" onclick="randomCard()">随机一张</button>
    </div>
    <div class="nav-btns">
      <button class="nav-btn sec" onclick="prevCard()">‹ 上一张</button>
      <button class="nav-btn" onclick="nextCard()">下一张 ›</button>
    </div>
    <p class="key-hints">
      <kbd>←</kbd><kbd>→</kbd> 翻页 &nbsp;
      <kbd>空格</kbd> 翻转 &nbsp;
      <kbd>M</kbd> 已掌握 &nbsp;
      <kbd>U</kbd> 不熟悉 &nbsp;
      <kbd>R</kbd> 随机
    </p>
  </div>

  <!-- list mode -->
  <div class="lv" id="listView">
    <div style="text-align:center;margin-bottom:12px;display:flex;gap:8px;justify-content:center">
      <button class="a-btn a-rand" onclick="expandAll()">展开全部</button>
      <button class="a-btn a-rand" onclick="collapseAll()">折叠全部</button>
    </div>
    <div id="listInner"></div>
  </div>

  <!-- error mode -->
  <div class="ev" id="errorView">
    <h2>待复习 (<span id="errCount">0</span> 张)</h2>
    <div class="el" id="errList"></div>
    <button class="nav-btn" style="margin-top:14px" onclick="clearErrors()">清空待复习</button>
  </div>

  <!-- summary -->
  <div class="sv" id="summaryView">
    <div class="big" id="sPct">0%</div>
    <p style="margin-bottom:14px;color:#666">整体掌握度</p>
    <table id="sTable"></table>
    <button class="nav-btn" style="margin-top:16px" onclick="resetAll()">重置全部进度</button>
  </div>
</div>

<script>
const STORE = 'hist_term_v2';

const cards = [
  // ========== 中国古代史 ==========
  {id:1,cat:"中国古代史",q:"秦朝建立的中央集权制度奠定了怎样的历史格局？",a:"<b>奠定了中国两千多年政治制度的基本格局</b>"},
  {id:2,cat:"中国古代史",q:"郡县制为什么说是官僚政治取代贵族政治的标志？",a:"<b>加强了中央对地方的控制</b>，是<b>官僚政治取代贵族政治</b>的重要标志"},
  {id:3,cat:"中国古代史",q:"明清时期君主专制是如何进一步强化的？",a:"<b>明废丞相设内阁，清设军机处</b>"},
  {id:4,cat:"中国古代史",q:"春秋战国儒家三位代表人物及各自核心主张？",a:"孔子→<b>「仁」</b>　孟子→<b>「仁政」</b>　荀子→<b>「礼法并施」</b>"},
  {id:5,cat:"中国古代史",q:"西汉儒学如何成为正统思想？",a:"董仲舒糅合百家，汉武帝采纳<b>「罢黜百家，独尊儒术」</b>"},
  {id:6,cat:"中国古代史",q:"宋明理学的特点是什么？谁是集大成者？",a:"<b>吸收佛道思想，更具思辨性</b>；<b>朱熹</b>是集大成者，成为官方正统哲学"},
  {id:7,cat:"中国古代史",q:"明清之际的进步思想家提出了什么主张？",a:"<b>反对君主专制、倡导经世致用</b>（王夫之等提出唯物观点批判理学空谈）"},
  {id:8,cat:"中国古代史",q:"中国古代选官制度的演变顺序是什么？",a:"察举制 → 九品中正制 → <b>科举制</b>"},
  {id:9,cat:"中国古代史",q:"科举制是什么时候创立和完善的？有什么历史意义？",a:"<b>隋朝创立，唐朝完善</b>；打破特权垄断，加强中央集权"},
  {id:10,cat:"中国古代史",q:"中国古代耕作方式的演变是什么？",a:"刀耕火种 → <b>铁犁牛耕</b>，秦汉确立<b>精耕细作小农经济</b>"},
  {id:11,cat:"中国古代史",q:"中国古代手工业的三大形态是什么？",a:"<b>官营、民营、家庭手工业</b>"},
  {id:12,cat:"中国古代史",q:"中国古代手工业三大突出领域是什么？",a:"<b>冶金、制瓷、纺织</b>"},
  {id:13,cat:"中国古代史",q:"宋代商业发展的标志性事件是什么？",a:"商品种类增加，出现世界上最早纸币<b>「交子」</b>"},
  {id:14,cat:"中国古代史",q:"明清商业发展有什么特点？",a:"区域间长途贩运发展，出现<b>商帮</b>（徽商、晋商最强）"},
  {id:15,cat:"中国古代史",q:"中国古代核心经济政策是什么？由谁首倡？",a:"<b>重农抑商</b>（商鞅首倡），限制工商业发展"},
  {id:16,cat:"中国古代史",q:"孟子的核心思想是什么？",a:"继承孔子「仁」，发展为<b>「仁政」</b>，贯穿民本思想"},
  {id:17,cat:"中国古代史",q:"韩非子的核心主张是什么？",a:"主张<b>改革和法治</b>，提出<b>君主专制中央集权</b>理论"},
  {id:18,cat:"中国古代史",q:"四大发明对世界文明有什么影响？",a:"<b>对周边国家及世界文明产生巨大影响</b>：造纸术→文化传播，火药→军事变革，印刷术→知识普及，指南针→新航路开辟"},
  {id:19,cat:"中国古代史",q:"中国古代文学的演变趋势是什么？",a:"诗经→楚辞→汉赋→唐诗→宋词→元曲→明清小说，呈现<b>平民化趋势</b>"},
  {id:104,cat:"中国古代史",q:"古代书画和京剧各自有何文化特色？",a:"古代书画<b>独具东方神韵</b>；京剧<b>独树一帜、雅俗共赏</b>"},

  // ========== 中国近现代史 ==========
  // 四次侵华战争 - 拆分为独立卡片
  {id:20,cat:"中国近现代史",q:"四次侵华战争社会性质变化口诀（程度递进）？",a:"鸦片战争→<b>开始沦为</b> / 第二次鸦片战争→<b>程度加深</b> / 甲午战争→<b>大大加深</b> / 八国联军→<b>完全沦为</b>半殖民地半封建社会"},
  {id:122,cat:"中国近现代史",q:"鸦片战争（1840）签订了什么条约？对中国社会性质有何影响？",a:"《<b>南京条约</b>》（1842）→ 中国<b>开始沦为</b>半殖民地半封建社会"},
  {id:123,cat:"中国近现代史",q:"第二次鸦片战争对中国社会性质有何影响？",a:"英法联军，签订系列条约 → 半殖民地程度<b>进一步加深</b>"},
  {id:124,cat:"中国近现代史",q:"甲午中日战争（1894）签订了什么条约？对中国社会性质有何影响？",a:"《<b>马关条约</b>》（1895）→ 半殖民地化程度<b>大大加深</b>"},
  {id:125,cat:"中国近现代史",q:"八国联军侵华（1900）签订了什么条约？对中国社会性质有何影响？",a:"《<b>辛丑条约</b>》（1901）→ 中国<b>完全沦为</b>半殖民地半封建社会"},
  {id:21,cat:"中国近现代史",q:"辛亥革命的历史意义和局限性分别是什么？",a:"<b>推翻封建帝制</b>，使<b>民主共和观念深入人心</b>；但<b>未改变中国半殖民地半封建的社会性质</b>"},
  {id:22,cat:"中国近现代史",q:"太平天国运动的双重任务是什么？",a:"<b>反封建 + 反侵略</b>，曾提出发展资本主义主张"},
  {id:23,cat:"中国近现代史",q:"五四运动有什么历史意义？",a:"<b>1919年</b>，<b>新民主主义革命的开端</b>，无产阶级登上政治舞台"},
  {id:24,cat:"中国近现代史",q:"中共诞生有什么历史意义？",a:"<b>1921年</b>中共诞生，<b>中国革命面貌焕然一新</b>"},
  {id:25,cat:"中国近现代史",q:"南昌起义有什么历史意义？",a:"<b>1927年</b>，<b>打响武装反抗国民党反动统治第一枪</b>"},
  {id:26,cat:"中国近现代史",q:"井冈山革命根据地开辟了什么道路？",a:"第一个农村革命根据地，开辟<b>「农村包围城市，武装夺取政权」</b>道路"},
  {id:27,cat:"中国近现代史",q:"遵义会议为什么被称为转折点？",a:"<b>1935年</b>，<b>生死攸关的转折点</b>——挽救了党、挽救了红军、挽救了革命"},
  {id:90,cat:"中国近现代史",q:"西安事变的时间、人物和历史意义？",a:"<b>1936年</b>张学良、杨虎城<b>兵谏</b>逼蒋抗日；和平解决标志着<b>抗日民族统一战线初步形成</b>"},
  {id:28,cat:"中国近现代史",q:"抗日民族统一战线是如何正式形成的？",a:"<b>1937年9月</b>国共合作宣言发表，<b>国共第二次合作</b>正式建立，<b>抗日民族统一战线</b>形成，<b>全民族抗战</b>开始"},
  {id:91,cat:"中国近现代史",q:"中共七大的时间和历史意义？",a:"<b>1945年延安</b>，确立<b>毛泽东思想</b>为党的指导思想"},
  {id:92,cat:"中国近现代史",q:"抗日战争胜利有什么历史意义？",a:"<b>1945年8月</b>，近代以来<b>第一次取得完全胜利的反侵略战争</b>"},
  {id:93,cat:"中国近现代史",q:"三大战役的时间、名称和意义？",a:"<b>1948-1949年</b>，<b>辽沈、淮海、平津</b>三大战役，基本歼灭国民党主力"},
  {id:29,cat:"中国近现代史",q:"中国近代民族工业产生于何时？",a:"<b>19世纪六七十年代</b>，中国近代民族工业产生"},
  {id:30,cat:"中国近现代史",q:"一战期间民族工业发展称为什么？",a:"<b>「短暂的春天」</b>——列强暂时放松对华侵略，民族工业迅速发展"},
  {id:31,cat:"中国近现代史",q:"甲午中日战争后中国民族工业发展状况如何？",a:"清政府放宽限制，<b>初步发展</b>"},
  {id:107,cat:"中国近现代史",q:"抗战和解放战争时期中国民族工业发展如何？",a:"抗战和解放战争时期，民族工业<b>日益萎缩</b>"},
  {id:32,cat:"中国近现代史",q:"推动近代社会生活变迁的四大重大事件？",a:"<b>辛亥革命、新文化运动、新中国成立、改革开放</b>"},
  {id:33,cat:"中国近现代史",q:"中国第一条自建铁路是什么？",a:"<b>1881年唐胥铁路</b>，中国第一条自建铁路"},
  {id:34,cat:"中国近现代史",q:"中国人自行设计的第一条铁路是什么？",a:"<b>1909年京张铁路</b>（詹天佑设计），里程碑意义"},
  {id:108,cat:"中国近现代史",q:"中国何时正式接入互联网？",a:"<b>20世纪90年代</b>，中国正式接入互联网"},
  {id:35,cat:"中国近现代史",q:"近代中国「开眼看世界」的第一批人物是谁？",a:"<b>林则徐、魏源</b>，倡导「师夷长技以制夷」"},
  {id:36,cat:"中国近现代史",q:"维新思想的历史作用是什么？",a:"变法图强、君主立宪，起到<b>思想启蒙作用</b>"},
  {id:109,cat:"中国近现代史",q:"民主共和思想的核心主张是什么？",a:"<b>推翻君主专制，建立民主共和国</b>"},
  {id:37,cat:"中国近现代史",q:"新文化运动高举哪两面大旗？历史意义？",a:"<b>民主与科学</b>，<b>动摇封建思想统治地位</b>（1915年陈独秀创办《青年杂志》）"},
  {id:38,cat:"中国近现代史",q:"五四运动后中国思想界的主流是什么？",a:"<b>马克思主义</b>成为中国思想界主流"},
  {id:94,cat:"中国近现代史",q:"新中国成立的时间和意义？",a:"<b>1949年10月1日</b>，中国人民从此站起来了，开辟中国历史新纪元"},
  {id:95,cat:"中国近现代史",q:"抗美援朝的时间和意义？",a:"<b>1950-1953年</b>，保家卫国，提高中国国际地位"},
  {id:96,cat:"中国近现代史",q:"一五计划的时间和重点？",a:"<b>1953-1957年</b>，优先发展<b>重工业</b>"},
  {id:97,cat:"中国近现代史",q:"一届人大与五四宪法的时间和意义？",a:"<b>1954年</b>，通过<b>第一部社会主义类型的宪法</b>，确立人民代表大会制度"},
  {id:39,cat:"中国近现代史",q:"中国的根本政治制度是什么？何时确立？",a:"<b>人民代表大会制度</b>（1954年宪法确立）"},
  {id:40,cat:"中国近现代史",q:"「依法治国」何时写入宪法？",a:"<b>1999年</b>，「依法治国」写入宪法"},
  {id:110,cat:"中国近现代史",q:"政治协商制度的作用是什么？",a:"<b>调动民主人士参政议政</b>"},
  {id:111,cat:"中国近现代史",q:"民族区域自治制度的法律依据？",a:"据<b>《共同纲领》和1954年宪法</b>"},
  {id:41,cat:"中国近现代史",q:"新中国成立初期三大外交方针是什么？",a:"<b>「另起炉灶」「一边倒」「打扫干净屋子再请客」</b>"},
  {id:42,cat:"中国近现代史",q:"新中国外交政策成熟的标志是什么？",a:"1953年提出<b>和平共处五项原则</b>"},
  {id:43,cat:"中国近现代史",q:"万隆会议上周恩来提出了什么方针？",a:"<b>「求同存异」</b>方针（1955年）"},
  {id:44,cat:"中国近现代史",q:"1970年代中国外交三大突破是什么？",a:"<b>1971年恢复联合国合法席位</b>；<b>1972年中美关系正常化、中日邦交正常化</b>"},
  {id:112,cat:"中国近现代史",q:"新时期中国的外交政策是什么？",a:"<b>不结盟政策</b>；成立<b>上海合作组织</b>"},
  {id:45,cat:"中国近现代史",q:"三大改造完成的时间和意义？",a:"<b>1956年底</b>三大改造完成，<b>社会主义经济基础初步建立</b>，标志着<b>社会主义制度在中国基本建立</b>"},
  {id:46,cat:"中国近现代史",q:"改革开放的战略决策是何时做出的？",a:"<b>1978年十一届三中全会</b>"},
  {id:47,cat:"中国近现代史",q:"中国经济体制改革的目标是什么？",a:"建立<b>社会主义市场经济体制</b>"},
  {id:113,cat:"中国近现代史",q:"中国对外开放格局的特征？",a:"<b>全方位、多角度</b>的对外开放格局"},
  {id:48,cat:"中国近现代史",q:"三民主义何时提出？有何地位？",a:"<b>1905年</b>提出，<b>辛亥革命的理论指导</b>"},
  {id:49,cat:"中国近现代史",q:"新三民主义的三大政策是什么？",a:"<b>联俄、联共、扶助农工</b>（1924年国共第一次合作基础）"},
  {id:50,cat:"中国近现代史",q:"毛泽东思想的核心内容是什么？",a:"<b>工农武装割据 + 新民主主义革命论</b>"},
  {id:51,cat:"中国近现代史",q:"邓小平理论的核心问题是什么？",a:"<b>什么是社会主义、怎样建设社会主义</b>"},
  {id:114,cat:"中国近现代史",q:"「三个代表」重要思想回答了什么？",a:"<b>建设什么样的党、怎样建设党</b>"},
  {id:52,cat:"中国近现代史",q:"现代中国取得了哪些重大科技成就？",a:"<b>两弹一星、杂交水稻、银河计算机、载人航天</b>"},
  {id:53,cat:"中国近现代史",q:"国家发展的重大战略是什么？",a:"<b>「科教兴国」</b>战略，为中国21世纪崛起奠定基础"},
  {id:115,cat:"中国近现代史",q:"「双百」方针的内容是什么？",a:"<b>百花齐放，百家争鸣</b>"},

  // ========== 世界古代史 ==========
  {id:54,cat:"世界古代史",q:"雅典民主政治的两大核心特点？",a:"<b>人民主权</b>与<b>轮番而治</b>"},
  {id:55,cat:"世界古代史",q:"雅典民主的局限性是什么？",a:"只是<b>成年男性公民</b>当家作主，妇女、外邦人、奴隶不享有"},
  {id:56,cat:"世界古代史",q:"罗马成文法诞生的标志是什么？",a:"<b>《十二铜表法》</b>，平民与贵族斗争成果"},
  {id:57,cat:"世界古代史",q:"罗马法的核心原则是什么？",a:"<b>保护私有财产</b>，提倡<b>法律面前公民人人平等</b>"},
  {id:58,cat:"世界古代史",q:"西方人文精神发展的三个阶段是什么？",a:"起源（智者学派/苏格拉底·强调人的价值）→ 复兴（<b>文艺复兴</b>·以人为中心）→ 发展（<b>启蒙运动</b>·理性主义反专制）"},
  {id:59,cat:"世界古代史",q:"苏格拉底的核心主张是什么？",a:"<b>美德即知识</b>（知识是美德的基础）"},
  {id:99,cat:"世界古代史",q:"文艺复兴的核心思想是什么？",a:"<b>人文主义</b>，以人为中心，反对神权束缚（薄伽丘《十日谈》、达芬奇等）"},
  {id:126,cat:"世界古代史",q:"启蒙运动的核心主张有哪些？",a:"以<b>理性主义</b>为旗帜；提出<b>天赋人权、社会契约论</b>；反对专制和神学；为资产阶级革命奠定思想基础"},

  // ========== 资本主义制度 ==========
  {id:60,cat:"资本主义制度",q:"英国君主立宪制确立的标志是什么？",a:"<b>1689年《权利法案》</b>，限制王权，<b>议会至上</b>"},
  {id:61,cat:"资本主义制度",q:"美国政治体制及特点是什么？",a:"<b>总统共和制</b>，1787年宪法确立<b>联邦制 + 三权分立</b>"},
  {id:62,cat:"资本主义制度",q:"法国共和制是何时确立的？",a:"<b>1875年宪法</b>，历经反复最终确立议会共和制"},
  {id:63,cat:"资本主义制度",q:"德国君主立宪制有什么特点？",a:"1871年帝国宪法，带有<b>浓厚专制军国主义色彩</b>"},
  {id:64,cat:"资本主义制度",q:"马克思主义诞生的标志是什么？",a:"1848年<b>《共产党宣言》</b>发表 → 社会主义由空想变科学"},
  {id:65,cat:"资本主义制度",q:"巴黎公社的历史意义是什么？",a:"<b>暴力革命推翻资产阶级政府</b>，普选建立新型政权（第一次无产阶级政权尝试）"},
  {id:66,cat:"资本主义制度",q:"十月革命有什么历史意义？",a:"<b>1917年列宁领导</b>，建立人类历史上<b>第一个社会主义国家</b>，打破资本主义一统天下"},

  // ========== 全球联系与革命 ==========
  {id:67,cat:"全球联系与革命",q:"新航路开辟的动力是什么？",a:"追求财富 + 地理知识 + <b>航海技术进步</b> + 传播天主教"},
  {id:68,cat:"全球联系与革命",q:"新航路开辟对世界产生了什么影响？",a:"<b>打破世界孤立</b>，促使世界连成整体，<b>为世界市场形成奠定基础</b>"},
  {id:69,cat:"全球联系与革命",q:"殖民扩张的双面性是什么？",a:"促进欧洲资本主义发展，但给亚非拉带来<b>深重灾难</b>"},
  {id:116,cat:"全球联系与革命",q:"殖民霸权的更替顺序是什么？",a:"<b>荷兰</b>（17世纪）→ <b>英国</b>（18世纪中期成为最大殖民国家「日不落帝国」）"},
  {id:70,cat:"全球联系与革命",q:"第一次工业革命的标志和时代名称是什么？",a:"<b>18世纪中—19世纪中</b>，<b>蒸汽机的改良和应用</b> → 人类进入<b>「蒸汽时代」</b>，机器生产取代手工劳动"},
  {id:71,cat:"全球联系与革命",q:"第二次工业革命的标志和时代名称是什么？",a:"<b>19世纪70年代起</b>，<b>电力和内燃机的广泛应用</b> → 人类进入<b>「电气时代」</b>"},
  {id:72,cat:"全球联系与革命",q:"第二次工业革命对资本主义的影响是什么？",a:"<b>垄断组织形成</b>，资本主义世界体系最终确立"},
  {id:73,cat:"全球联系与革命",q:"现代物理学的两大支柱是什么？",a:"<b>相对论</b>（爱因斯坦）+ <b>量子论</b>（普朗克）"},
  {id:117,cat:"全球联系与革命",q:"近代科学革命中谁奠定了经典力学基础？",a:"<b>牛顿</b>经典力学奠基，标志近代科学形成"},
  {id:118,cat:"全球联系与革命",q:"技术革命的三阶段是什么？",a:"<b>蒸汽时代 → 电气时代 → 信息时代</b>"},
  {id:74,cat:"全球联系与革命",q:"达尔文进化论的历史意义是什么？",a:"<b>破解生命起源之谜</b>，否定宗教创世说"},

  // ========== 战争与格局 ==========
  {id:131,cat:"战争与格局",q:"第二次世界大战的时间和重要转折点？",a:"<b>1939-1945年</b>；转折点：<b>斯大林格勒战役（1942-1943）</b>；1945年5月德国投降，8月日本投降"},
  {id:75,cat:"战争与格局",q:"浪漫主义文学的特点是什么？",a:"挖掘情感世界，<b>瑰丽想象和夸张手法</b>"},
  {id:76,cat:"战争与格局",q:"批判现实主义文学的特点是什么？",a:"<b>关注社会问题</b>，揭露批判社会罪恶"},
  {id:77,cat:"战争与格局",q:"贝多芬在音乐史上有何地位？",a:"欧洲<b>古典主义向浪漫主义过渡的桥梁</b>"},
  {id:119,cat:"战争与格局",q:"电影诞生于何时何处？",a:"<b>1895年</b>，法国<b>卢米埃尔兄弟</b>放映电影 → 电影诞生"},
  {id:78,cat:"战争与格局",q:"罗斯福新政的核心创新是什么？",a:"<b>1933年</b>，开创<b>国家干预经济</b>新模式，由自由主义转向凯恩斯主义"},
  {id:100,cat:"战争与格局",q:"1929-1933年经济大危机从哪里开始？造成了什么后果？",a:"从<b>美国</b>开始，席卷整个资本主义世界，引发严重政治经济危机"},
  {id:101,cat:"战争与格局",q:"联合国的成立时间和意义？",a:"<b>1945年</b>（雅尔塔会议决定），维护世界和平与安全"},
  {id:102,cat:"战争与格局",q:"冷战的含义和主要表现？",a:"<b>二战后</b>美苏<b>两极对峙</b>，不诉诸直接武力；表现：杜鲁门主义、马歇尔计划、<b>北约 vs 华约</b>"},
  {id:103,cat:"战争与格局",q:"苏联解体的时间和影响？",a:"<b>1991年</b>苏联解体，两极格局瓦解，世界朝<b>多极化</b>方向发展"},
  {id:127,cat:"战争与格局",q:"第二次世界大战全面爆发的标志是什么？",a:"<b>1939年</b>德国突袭波兰，英法对德宣战"},
  {id:128,cat:"战争与格局",q:"二战中具有转折意义的战役有哪些？",a:"<b>斯大林格勒战役</b>（欧洲战场转折）、<b>中途岛海战</b>（太平洋战场转折）"},
  {id:129,cat:"战争与格局",q:"二战结束的标志是什么？",a:"<b>1945年</b>：5月德国投降→欧洲战场结束；8月日本投降→二战全面结束"},
  {id:130,cat:"战争与格局",q:"二战的性质和影响是什么？",a:"<b>世界反法西斯战争</b>；战后形成美苏两极格局，联合国成立"},
  {id:79,cat:"战争与格局",q:"二战后资本主义经济制度的重要变化是什么？",a:"<b>国家对经济宏观调节</b>成为资本主义经济制度重要组成部分"},
  {id:120,cat:"战争与格局",q:"二战后「福利国家」出现的原因？",a:"<b>人道主义</b> + 对社会矛盾加深的恐惧"},
  {id:80,cat:"战争与格局",q:"列宁探索的向社会主义过渡的正确途径是什么？",a:"从<b>战时共产主义</b>转向<b>新经济政策</b>，是向社会主义过渡的正确途径"},
  {id:81,cat:"战争与格局",q:"斯大林模式有哪些积极作用和局限性？",a:"初期和战争时期发挥积极作用，但<b>不是建设社会主义的唯一模式</b>"},
  {id:82,cat:"战争与格局",q:"苏联解体的直接原因是什么？",a:"戈尔巴乔夫改革<b>偏离社会主义方向</b>，出现<b>方向性错误</b>"},
  {id:83,cat:"战争与格局",q:"二战后初期的世界格局是什么？",a:"<b>美苏两极对峙</b>，「冷战」局面"},
  {id:84,cat:"战争与格局",q:"世界多极化趋势何时出现？",a:"<b>20世纪60-70年代</b>，欧共体、日本、第三世界崛起"},
  {id:85,cat:"战争与格局",q:"当前世界格局的特征是什么？",a:"<b>「一超多强」</b>，多极化趋势加强（美国为超级大国，中俄欧日等多强并立）"},
  {id:86,cat:"战争与格局",q:"经济全球化实质上是怎样的过程？",a:"<b>以发达资本主义国家为主导</b>，资本在全球范围内的新一轮扩张"},
  {id:87,cat:"战争与格局",q:"经济全球化对发展中国家有什么影响？",a:"<b>「双刃剑」</b>——机遇与挑战并存，应积极参与、趋利避害"},
  {id:88,cat:"战争与格局",q:"布雷顿森林体系的核心是什么？",a:"<b>美元与黄金挂钩</b>，稳定世界经济秩序"},
  {id:89,cat:"战争与格局",q:"区域集团化的三个代表及其性质？",a:"<b>欧盟</b>（体制化）、<b>北美自贸区</b>（半体制化）、<b>APEC</b>（论坛性）"},
  {id:121,cat:"战争与格局",q:"《关税及贸易总协定》的作用是什么？",a:"<b>降低关税，减少贸易壁垒</b>（WTO前身）"},
];

const cats = [...new Set(cards.map(c=>c.cat))];
let mode='card', filter='all', idx=0, filtered=[...cards], unfamiliarOnly=false;
let mastered=load('mastered'), unfamiliar=load('unfamiliar');

function load(k){try{return JSON.parse(localStorage.getItem(STORE+'_'+k))||{}}catch(e){return{}}}
function save(){
  localStorage.setItem(STORE+'_mastered',JSON.stringify(mastered));
  localStorage.setItem(STORE+'_unfamiliar',JSON.stringify(unfamiliar));
}
function getFiltered(){
  let a=filter==='all'?[...cards]:cards.filter(c=>c.cat===filter);
  let q=document.getElementById('searchBox').value.toLowerCase();
  if(q)a=a.filter(c=>c.q.toLowerCase().includes(q)||c.a.toLowerCase().includes(q));
  if(unfamiliarOnly)a=a.filter(c=>unfamiliar[c.id]);
  return a;
}
function updateStats(){
  filtered=getFiltered();
  let total=filtered.length, m=filtered.filter(c=>mastered[c.id]).length, u=filtered.filter(c=>unfamiliar[c.id]).length;
  let p=total?Math.round(m/total*100):0;
  document.getElementById('tN').textContent=total;
  document.getElementById('mN').textContent=m;
  document.getElementById('uN').textContent=u;
  document.getElementById('pP').textContent=p+'%';
  document.getElementById('pFill').style.width=p+'%';
}
function renderCard(){
  if(!filtered.length){
    document.getElementById('cQ').textContent='没有匹配的卡片';
    document.getElementById('cA').innerHTML='';
    document.getElementById('cBadge').textContent='';
    document.getElementById('cId').textContent='';
    return;
  }
  if(idx>=filtered.length)idx=0;
  if(idx<0)idx=filtered.length-1;
  let c=filtered[idx];
  document.getElementById('cBadge').textContent=c.cat;
  document.getElementById('cId').textContent=(idx+1)+' / '+filtered.length;
  document.getElementById('cQ').textContent=c.q;
  document.getElementById('cA').innerHTML=c.a;
  let card=document.getElementById('card');
  card.classList.remove('flipped','mastered','unfamiliar');
  if(mastered[c.id])card.classList.add('mastered');
  if(unfamiliar[c.id])card.classList.add('unfamiliar');
}
function flip(){
  document.getElementById('card').classList.toggle('flipped');
}
function mark(t){
  let c=filtered[idx]; if(!c)return;
  delete mastered[c.id]; delete unfamiliar[c.id];
  if(t==='mastered')mastered[c.id]=true;
  if(t==='unfamiliar')unfamiliar[c.id]=true;
  save(); updateStats(); renderCard(); buildList(); buildError(); buildSummary();
  if(document.getElementById('autoAdv').checked && filtered.length>1){
    setTimeout(()=>{nextCard();},300);
  }
}
function nextCard(){
  if(!filtered.length)return;
  idx=(idx+1)%filtered.length;
  renderCard();
}
function prevCard(){
  if(!filtered.length)return;
  idx=(idx-1+filtered.length)%filtered.length;
  renderCard();
}
function randomCard(){
  if(!filtered.length)return;
  let newIdx=Math.floor(Math.random()*filtered.length);
  idx=newIdx;
  renderCard(); // 只显示题目，不自动翻转
}
function applySearch(){updateStats();idx=0;renderCard();buildList();}

function buildList(){
  let lv=document.getElementById('listInner'), html='';
  cats.forEach(cat=>{
    let inFilter=filtered.filter(c=>c.cat===cat);
    if(!inFilter.length)return;
    let cs=cards.filter(c=>c.cat===cat);
    html+='<div class="g"><h3>'+cat+' ('+inFilter.length+'/'+cs.length+')</h3>';
    inFilter.forEach(c=>{
      let cls='it';
      if(mastered[c.id])cls+=' mastered';
      if(unfamiliar[c.id])cls+=' unfamiliar';
      html+='<div class="'+cls+'" onclick="this.classList.toggle(\'on\')"><div class="iq">'+c.q+'</div><div class="ia">'+c.a+'</div></div>';
    });
    html+='</div>';
  });
  lv.innerHTML=html||'<p style="text-align:center;color:#999;padding:20px">无匹配卡片</p>';
}
function expandAll(){document.querySelectorAll('#listInner .it').forEach(el=>el.classList.add('on'));}
function collapseAll(){document.querySelectorAll('#listInner .it').forEach(el=>el.classList.remove('on'));}

function buildError(){
  let errs=cards.filter(c=>unfamiliar[c.id]);
  document.getElementById('errCount').textContent=errs.length;
  let el=document.getElementById('errList');
  el.innerHTML=errs.map((c,i)=>
    '<div class="ei" onclick="jumpToCard('+c.id+')"><div class="eq">'+(i+1)+'. '+c.q+'</div><div class="ea">'+c.a+'</div></div>'
  ).join('')||'<p style="text-align:center;color:#999;padding:20px">暂无待复习卡片 🎉</p>';
}

function buildSummary(){
  let total=cards.length, m=cards.filter(c=>mastered[c.id]).length;
  document.getElementById('sPct').textContent=(total?Math.round(m/total*100):0)+'%';
  let st=document.getElementById('sTable');
  st.innerHTML=cats.map(cat=>{
    let cs=cards.filter(c=>c.cat===cat);
    let cm=cs.filter(c=>mastered[c.id]).length;
    let p=cs.length?Math.round(cm/cs.length*100):0;
    return '<tr><td class="cname">'+cat+'</td><td style="white-space:nowrap">'+cm+'/'+cs.length+'</td><td style="width:50%"><div class="cbar"><div class="cfill" style="width:'+p+'%"></div></div></td></tr>';
  }).join('');
}

function jumpToCard(id){
  switchMode('card');
  filter='all';
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.cat-btn[data-cat="all"]').classList.add('active');
  updateStats();
  let ci=filtered.findIndex(c=>c.id===id);
  if(ci>=0)idx=ci;
  renderCard();
}

function switchMode(m){
  mode=m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.mode-btn')[['card','list','error','summary'].indexOf(m)].classList.add('active');
  document.getElementById('cardView').style.display=m==='card'?'block':'none';
  document.getElementById('listView').className='lv'+(m==='list'?' on':'');
  document.getElementById('errorView').className='ev'+(m==='error'?' on':'');
  document.getElementById('summaryView').className='sv'+(m==='summary'?' on':'');
  let showSearch=(m==='card'||m==='list');
  document.getElementById('searchBox').style.display=showSearch?'block':'none';
  document.getElementById('btnUnfOnly').style.display=showSearch?'inline-block':'none';
  document.getElementById('autoAdvLabel').style.display=m==='card'?'flex':'none';
  if(m==='list')buildList();
  if(m==='error')buildError();
  if(m==='summary')buildSummary();
}
function toggleUnfamiliarOnly(){
  unfamiliarOnly=!unfamiliarOnly;
  let btn=document.getElementById('btnUnfOnly');
  btn.textContent=unfamiliarOnly?'✓ 只看不熟悉':'只看不熟悉';
  btn.style.background=unfamiliarOnly?'#ffc107':'';
  btn.style.color=unfamiliarOnly?'#333':'';
  updateStats(); idx=0; renderCard(); buildList();
}

function clearErrors(){unfamiliar={};save();updateStats();renderCard();buildList();buildError();buildSummary();}
function resetAll(){mastered={};unfamiliar={};save();updateStats();renderCard();buildList();buildError();buildSummary();}

// ===== 初始化 =====
filtered=getFiltered();
let cn=document.getElementById('catNav');
cn.innerHTML='<button class="cat-btn active" data-cat="all" onclick="setFilter(\'all\')">全部<span class="ct">'+cards.length+'</span></button>';
cats.forEach(c=>{
  let cnt=cards.filter(x=>x.cat===c).length;
  cn.innerHTML+='<button class="cat-btn" data-cat="'+c+'" onclick="setFilter(\''+c+'\')">'+c+'<span class="ct">'+cnt+'</span></button>';
});
function setFilter(f){
  filter=f;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.cat-btn[data-cat="'+f+'"]').classList.add('active');
  updateStats(); idx=0; renderCard(); buildList();
}
updateStats(); renderCard(); buildList(); buildError(); buildSummary();

// ===== 键盘快捷键 =====
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(mode!=='card')return;
  if(e.key==='ArrowRight')nextCard();
  if(e.key==='ArrowLeft')prevCard();
  if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();}
  if(e.key==='m'||e.key==='M'){mark('mastered');}
  if(e.key==='u'||e.key==='U'){mark('unfamiliar');}
  if(e.key==='r'||e.key==='R'){randomCard();}
});

// ===== 滑动手势 =====
let tx=0, ty=0, dragging=false;
const wrap=document.getElementById('cardWrap');
wrap.addEventListener('touchstart',e=>{
  tx=e.touches[0].clientX; ty=e.touches[0].clientY; dragging=false;
},{passive:true});
wrap.addEventListener('touchmove',e=>{
  let dx=Math.abs(e.touches[0].clientX-tx), dy=Math.abs(e.touches[0].clientY-ty);
  if(dx>10)dragging=true;
},{passive:true});
wrap.addEventListener('touchend',e=>{
  if(!dragging)return;
  let dx=e.changedTouches[0].clientX-tx;
  let dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)*1.5 && Math.abs(dx)>40){
    if(dx>0)prevCard(); else nextCard();
  }
},{passive:true});
</script>
</body>
</html>
